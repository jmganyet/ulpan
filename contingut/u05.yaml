gramatica:
  - id: yesh-en
    titol: "Hi ha, no hi ha: יֵשׁ i אֵין"
    explicacio: "יֵשׁ i אֵין no canvien amb el gènere ni amb el nombre, i el lloc pot anar davant o darrere. La negació de יֵשׁ és אֵין, mai «לֹא יֵשׁ»; לֹא queda per al «no» sol de la resposta."
    exemples:
      - { n: "כֵּן, בַּגָּלִיל יֵשׁ הַרְבֵּה קִיבּוּצִים.", ca: "Sí, a Galilea hi ha molts quibutsos." }
      - { n: "לֹא, בִּדְרוֹם-אֲמֶרִיקָה אֵין קִיבּוּצִים.", ca: "No, a Sud-amèrica no hi ha quibutsos." }
      - { n: "בְּקִיבּוּץ דָּן יֵשׁ אוּלְפָּן?", ca: "Al quibuts Dan hi ha ulpan?" }
      - { n: "יֵשׁ בָּאוּלְפָּן הַרְבֵּה תַּלְמִידִים מֵאַרְצוֹת-הַבְּרִית?", ca: "Hi ha molts alumnes dels Estats Units a l'ulpan?" }
  - id: harbe-meat
    titol: "Molts, pocs, només, o"
    explicacio: "הַרְבֵּה i מְעַט van davant del nom i no concorden (הַרְבֵּה קִיבּוּצִים, הַרְבֵּה כִּיתּוֹת); הַרְבֵּה pot anar sol si el nom ja s'ha dit. רַק va just davant del que restringeix, i אוֹ uneix dues alternatives."
    exemples:
      - { n: "בָּאוּלְפָּן יֵשׁ הַרְבֵּה כִּיתּוֹת?", ca: "A l'ulpan hi ha moltes classes?" }
      - { n: "לֹא, מֵאַרְצוֹת-הַבְּרִית אֵין הַרְבֵּה.", ca: "No, dels Estats Units no n'hi ha gaires." }
      - { n: "גַּם מִבְּרָזִיל יֵשׁ רַק מְעַט תַּלְמִידִים.", ca: "Del Brasil també només hi ha pocs alumnes." }
      - { n: "לֹא, בָּאוּלְפָּן, בְּקִיבּוּץ דָּן יֵשׁ רַק שָׁלוֹשׁ כִּיתּוֹת.", ca: "No, a l'ulpan del quibuts Dan només hi ha tres classes." }
      - { n: "בָּאוּלְפָּן יֵשׁ מוֹרִים, אוֹ מוֹרוֹת?", ca: "A l'ulpan hi ha mestres homes o mestres dones?" }
  - id: holekh-ba
    titol: "Anar i venir: הוֹלֵךְ i בָּא"
    explicacio: "El present té quatre formes, com לוֹמֵד: הוֹלֶכֶת fa el femení en ‑ֶת i בָּאָה en ‑ָה. Els infinitius són לָלֶכֶת (sense ה) i לָבוֹא; de בָּא, el present i el passat (ell) s'escriuen igual."
    exemples:
      - { u: "הולך · הולכת · הולכים · הולכות", n: "הוֹלֵךְ · הוֹלֶכֶת · הוֹלְכִים · הוֹלְכוֹת", ca: "va (m. sg. · f. sg. · m. pl. · f. pl.)" }
      - { u: "בא · באה · באים · באות", n: "בָּא · בָּאָה · בָּאִים · בָּאוֹת", ca: "ve (m. sg. · f. sg. · m. pl. · f. pl.)" }
      - { n: "לֹא, אֲנִי הוֹלֶכֶת לַקּוֹנְצֶרְט.", ca: "No, vaig al concert. (parla una dona)" }
      - { n: "גַּם אַתְּ בָּאָה לַתֵּיאַטְרוֹן?", ca: "Tu també vens al teatre? (a una dona)" }
      - { n: "הוֹלֵךְ - לָלֶכֶת (הָלַךְ) · בָּא - לָבוֹא (בָּא)", ca: "va – anar (va anar) · ve – venir (va venir)" }
  - id: preguntes-lloc
    titol: "D'on, on, cap a on: מֵאַיִן, אֵיפֹה, לְאָן"
    explicacio: "Cada pregunta té la seva preposició: מֵאַיִן amb מִ־ (de), אֵיפֹה amb בְּ־ (quiet: גָּר, לוֹמֵד, עוֹבֵד) i לְאָן amb לְ־ (en moviment: הוֹלֵךְ, בָּא). En català diem «on» per a tot."
    exemples:
      - { n: "מֵאַיִן...? · אֵיפֹה...? · לְאָן...?", ca: "D'on...? · On...? · Cap a on...?" }
      - { n: "אֵיפֹה רָחֵל? — רָחֵל בַּבַּיִת.", ca: "On és la Rakhel? — La Rakhel és a casa." }
      - { n: "יוֹסִי, לְאָן אַתָּה הוֹלֵךְ?", ca: "Iossi, on vas?" }
      - { n: "מֵאַיִן אַתָּה בָּא וּלְאָן אַתָּה הוֹלֵךְ?", ca: "D'on vens i on vas?" }
      - { n: "לְאָן הוֹלְכִים רוֹבֶּרְטוֹ וְיַעֲקֹב?", ca: "On van el Roberto i el Iaakov? (el verb davant del subjecte)" }
  - id: le-la-be-ba
    titol: "L'article dins de בְּ i לְ"
    explicacio: "בְּ + הַ fa בַּ i לְ + הַ fa לַ: la ה cau i la preposició en pren la vocal (בָּ, לָ davant de הָ: בָּאוּלְפָּן, לָעֲבוֹדָה). Els noms propis no porten article (לְקִיבּוּץ דָּן). Sense vocals no es veu: לקיבוץ pot ser לְ o לַ."
    exemples:
      - { n: "רוֹבֶּרְטוֹ בָּא מִבְּרָזִיל לְקִיבּוּץ דָּן.", ca: "El Roberto va venir del Brasil al quibuts Dan." }
      - { n: "הוּא בָּא לַקִּיבּוּץ בְּפֶבְּרוּאָר.", ca: "Va arribar al quibuts al febrer." }
      - { n: "רוֹבֶּרְטוֹ גָּר עַכְשָׁיו בְּקִיבּוּץ דָּן.", ca: "Ara el Roberto viu al quibuts Dan." }
      - { n: "בַּקִּיבּוּץ הוּא עוֹבֵד וְלוֹמֵד.", ca: "Al quibuts treballa i estudia." }
      - { n: "לְ + הַקִּיבּוּץ = לַקִּיבּוּץ · בְּ + הַקִּיבּוּץ = בַּקִּיבּוּץ", ca: "a + el quibuts = al quibuts (cap a i dins)", extra: true }
  - id: bi-li
    titol: "בִּ־ i לִ־ davant de xevà"
    explicacio: "Si el mot comença amb xevà, la preposició no pot portar-ne un altre i passa a בִּ־ o לִ־. Ho fa el dossier a בִּדְרוֹם-אֲמֶרִיקָה i a לִתְשׁוּבוֹת."
    exemples:
      - { n: "גַּם בִּדְרוֹם-אֲמֶרִיקָה יֵשׁ קִיבּוּצִים?", ca: "També hi ha quibutsos a Sud-amèrica?" }
      - { n: "כְּתוֹב שְׁאֵלוֹת לִתְשׁוּבוֹת.", ca: "Escriu preguntes per a les respostes." }
  - id: babayit-habayta
    titol: "בַּבַּיִת, לַבַּיִת, הַבַּיְתָה"
    explicacio: "בַּבַּיִת és a casa, sense moviment; לַבַּיִת שֶׁל… és cap a la casa d'algú; הַבַּיְתָה és cap a casa (la pròpia). הַבַּיְתָה va sola, mai «לְהַבַּיְתָה», i només amb verbs de moviment."
    exemples:
      - { n: "רָחֵל בַּבַּיִת.", ca: "La Rakhel és a casa." }
      - { n: "רוֹבֶּרְטוֹ הוֹלֵךְ לַבַּיִת שֶׁל רָחֵל וְיַעֲקֹב.", ca: "El Roberto va a casa de la Rakhel i el Iaakov." }
      - { n: "יַעֲקֹב הוֹלֵךְ הַבַּיְתָה.", ca: "El Iaakov va cap a casa." }
      - { n: "אֲנִי הוֹלֵךְ הַבַּיְתָה. לְהִתְרָאוֹת!", ca: "Vaig cap a casa. A reveure!" }
  - id: shiur-kita
    titol: "שִׁיעוּר i כִּיתָּה"
    explicacio: "שִׁיעוּר és la lliçó, la sessió; כִּיתָּה és el grup i l'aula. Totes dues es diuen «classe» en català."
    exemples:
      - { n: "סְלִיחָה, עַכְשָׁיו יֵשׁ שִׁיעוּר. שָׁלוֹם! אֲנִי הוֹלֵךְ לַכִּיתָּה.", ca: "Perdó, ara hi ha classe. Adéu! Vaig a classe." }
      - { n: "הַכִּיתָּה גְּדוֹלָה? הִיא יָפָה?", ca: "La classe és gran? És bonica?" }

