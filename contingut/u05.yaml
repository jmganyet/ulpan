  # pag-32, תרגיל 17: la pregunta per a cada resposta. Adaptat: es dona la resta de la pregunta
  # (el verb de la resposta) i es tria la paraula interrogativa.
  - { tipus: forat, origen: "pag-32 ex. 17.1", extra: false, linies: [pag-32-b1-l0],
      frase: { u: "____ היא הולכת? – היא הולכת לאופרה.", n: "____ הִיא הוֹלֶכֶת? – הִיא הוֹלֶכֶת לָאוֹפֵּרָה." },
      opcions: ["אֵיפֹה", "מֵאַיִן", "לְאָן"], correcta: 2, retro: "Va cap a un lloc (לְ־): לְאָן." }
  - { tipus: forat, origen: "pag-32 ex. 17.2", extra: false, linies: [pag-32-b1-l1],
      frase: { u: "____ היא עובדת? – היא עובדת בבנק.", n: "____ הִיא עוֹבֶדֶת? – הִיא עוֹבֶדֶת בַּבַּנְק." },
      opcions: ["אֵיפֹה", "מֵאַיִן", "לְאָן"], correcta: 0, retro: "Treballar és estar en un lloc (בְּ־): אֵיפֹה." }
  - { tipus: forat, origen: "pag-32 ex. 17.3", extra: false, linies: [pag-32-b1-l2],
      frase: { u: "____ היא באה? – היא באה מהבית.", n: "____ הִיא בָּאָה? – הִיא בָּאָה מֵהַבַּיִת." },
      opcions: ["אֵיפֹה", "מֵאַיִן", "לְאָן"], correcta: 1, retro: "Ve d'un lloc (מִ־): מֵאַיִן." }
  - { tipus: forat, origen: "pag-32 ex. 17.4", extra: false, linies: [pag-32-b1-l3],
      frase: { u: "____ היא הולכת? – היא הולכת הביתה.", n: "____ הִיא הוֹלֶכֶת? – הִיא הוֹלֶכֶת הַבַּיְתָה." },
      opcions: ["אֵיפֹה", "מֵאַיִן", "לְאָן"], correcta: 2, retro: "הַבַּיְתָה respon a לְאָן: cap a casa." }
