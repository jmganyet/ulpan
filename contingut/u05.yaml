# Capa curada de la unitat 5: icones, textos, gramàtica, exercicis.
# Format: vegeu scripts/genera-contingut.ts (tipus Curat).
# Vocals verificades amb els TSV (u01-u05) i la fitxa u05-anar-i-venir del dossier, i amb Pealim
# (הוֹלֵךְ i בָּא: present, infinitiu i passat; תֵּיאַטְרוֹן, מוּזֵיאוֹן, בַּנְק) i Wiktionary (אוֹפֵּרָה,
# פֶבְּרוּאָר, אַפְּרִיל). קוֹנְצֶרְט amb segol, com la fitxa del dossier (Wiktionary: קוֹנְצֵרְט; sona igual).
# Grafia plena amb vocals (R19): כִּיתָּה, כִּיתּוֹת, שִׁיעוּר, קִיבּוּץ, בַּמִּילִּים.
# Article contret amb la preposició segons el sentit: לַכִּיתָּה, לַשִּׁיעוּר, לַתֵּיאַטְרוֹן, לַקּוֹנְצֶרְט, לָעֲבוֹדָה,
# לָאוֹפֵּרָה, בַּבַּנְק (amb article); לְקִיבּוּץ דָּן, בְּחֵיפָה, לְיִשְׂרָאֵל (noms propis, sense).
# Dagesh darrere de מַה (מַה יֵּשׁ), com a la u04.
# Als buits de l'ex. 18 el mot es puntua en forma de citació (____קִיבּוּץ), sense prejutjar la preposició.
# Les línies «per comprovar» (⁇) no porten vocals ni traducció (pag-30-b1-l6). El títol de la pag-28 (⁇) no es toca.
# Sense vocals: pag-29-b2-l0 (תרגיל המרה, com a la u03).
# Línies que el dossier ja dona amb vocals (pag-29-b1, pag-30-b0, pag-31-b0-l1): només traducció.

textos:
  pag-28-b0:
    vocals:
      0: "אֵיפֹה אַתָּה גָּר, רוֹבֶּרְטוֹ?"
      1: "אֲנִי גָּר בְּקִיבּוּץ דָּן בַּגָּלִיל."
      2: "בַּגָּלִיל יֵשׁ הַרְבֵּה קִיבּוּצִים?"
      3: "כֵּן, בַּגָּלִיל יֵשׁ הַרְבֵּה קִיבּוּצִים."
      4: "גַּם בִּדְרוֹם-אֲמֶרִיקָה יֵשׁ קִיבּוּצִים?"
      5: "לֹא, בִּדְרוֹם-אֲמֶרִיקָה אֵין קִיבּוּצִים."
      6: "בְּקִיבּוּץ דָּן יֵשׁ אוּלְפָּן?"
      7: "כֵּן, בְּקִיבּוּץ דָּן יֵשׁ אוּלְפַּן-עֲבוֹדָה."
      8: "אַתָּה לוֹמֵד בָּאוּלְפָּן בְּקִיבּוּץ דָּן?"
      9: "כֵּן, אֲנִי לוֹמֵד שָׁם."
      10: "בָּאוּלְפָּן יֵשׁ הַרְבֵּה כִּיתּוֹת?"
      11: "לֹא, בָּאוּלְפָּן, בְּקִיבּוּץ דָּן יֵשׁ רַק שָׁלוֹשׁ כִּיתּוֹת."
      12: "יֵשׁ בָּאוּלְפָּן הַרְבֵּה תַּלְמִידִים מֵאַרְצוֹת-הַבְּרִית?"
      13: "לֹא, מֵאַרְצוֹת-הַבְּרִית אֵין הַרְבֵּה."
      14: "וּמִבְּרָזִיל?"
      15: "גַּם מִבְּרָזִיל יֵשׁ רַק מְעַט תַּלְמִידִים."
      16: "בָּאוּלְפָּן יֵשׁ מוֹרִים, אוֹ מוֹרוֹת?"
      17: "בָּאוּלְפָּן בְּקִיבּוּץ דָּן יֵשׁ רַק מוֹרוֹת."
      18: "הַכִּיתָּה גְּדוֹלָה? הִיא יָפָה?"
      19: "כָּכָה-כָּכָה."
    ca:
      0: "On vius, Roberto?"
      1: "Visc al quibuts Dan, a Galilea."
      2: "A Galilea hi ha molts quibutsos?"
      3: "Sí, a Galilea hi ha molts quibutsos."
      4: "També hi ha quibutsos a Sud-amèrica?"
      5: "No, a Sud-amèrica no hi ha quibutsos."
      6: "Al quibuts Dan hi ha ulpan?"
      7: "Sí, al quibuts Dan hi ha un ulpan de treball."
      8: "Estudies a l'ulpan del quibuts Dan?"
      9: "Sí, hi estudio."
      10: "A l'ulpan hi ha moltes classes?"
      11: "No, a l'ulpan del quibuts Dan només hi ha tres classes."
      12: "Hi ha molts alumnes dels Estats Units a l'ulpan?"
      13: "No, dels Estats Units no n'hi ha gaires."
      14: "I del Brasil?"
      15: "Del Brasil també només hi ha pocs alumnes."
      16: "A l'ulpan hi ha mestres homes o mestres dones?"
      17: "A l'ulpan del quibuts Dan només hi ha mestres dones."
      18: "La classe és gran? És bonica?"
      19: "Així així."
  pag-29-b0:
    vocals:
      0: "מַה יֵּשׁ בַּכִּיתָּה?"
      1: "סְלִיחָה, עַכְשָׁיו יֵשׁ שִׁיעוּר. שָׁלוֹם! אֲנִי הוֹלֵךְ לַכִּיתָּה."
      2: "גַּם אַתָּה בָּא לַכִּיתָּה?"
      3: "לֹא."
      4: "לְאָן אַתָּה הוֹלֵךְ?"
      5: "אֲנִי הוֹלֵךְ הַבַּיְתָה. לְהִתְרָאוֹת!"
      6: "לְהִתְרָאוֹת!"
    ca:
      0: "Què hi ha a la classe?"
      1: "Perdó, ara hi ha classe. Adéu! Vaig a classe."
      2: "Tu també vens a classe?"
      3: "No."
      4: "On vas?"
      5: "Vaig cap a casa. A reveure!"
      6: "A reveure!"
  pag-29-b1:
    ca:
      0: "anar, en present: m. sg. · f. sg. · m. pl. · f. pl."
      1: "venir, en present: m. sg. · f. sg. · m. pl. · f. pl."
  pag-29-b2:
    ca:
      0: "Exercici de substitució"
  pag-29-b3:
    vocals:
      0: "1. [חַנָּה] בָּאָה לַשִּׁיעוּר. (יִצְחָק, שָׂרָה וְשׁוֹשַׁנָּה, הַתַּלְמִידִים)"
      1: "2. הוּא בָּא [לַכִּיתָּה]. (מִתֵּל-אָבִיב, לַחֶדֶר, לְיִשְׂרָאֵל, הַבַּיְתָה)"
      2: "3. [סְטִיב] הוֹלֵךְ לָעֲבוֹדָה. (יִצְחָק וַאֲנִי, הַמּוֹרוֹת, חַנָּה)"
      3: "4. מֵאַיִן [אַתָּה] בָּא וּלְאָן אַתָּה הוֹלֵךְ? (אַתֶּם, אַתְּ, אַתֶּן, חַנָּה)"
    ca:
      0: "1. [La Hanà] ve a classe. (l'Itshak, la Sara i la Xoixanà, els alumnes)"
      1: "2. Ell ve [a classe]. (de Tel Aviv, a l'habitació, a Israel, cap a casa)"
      2: "3. [L'Steve] va a la feina. (l'Itshak i jo, les mestres, la Hanà)"
      3: "4. D'on vens [tu] i on vas? (vosaltres, tu a una dona, vosaltres a dones, la Hanà)"
  pag-30-b0:
    ca:
      0: "Cap a on?"
      1: "le- · la- (amb l'article)"
  pag-30-b1:
    vocals:
      0: "יוֹסִי, לְאָן אַתָּה הוֹלֵךְ?"
      1: "אֲנִי הוֹלֵךְ לַתֵּיאַטְרוֹן, גַּם אַתְּ בָּאָה לַתֵּיאַטְרוֹן?"
      2: "לֹא, אֲנִי הוֹלֶכֶת לַקּוֹנְצֶרְט."
      3: "גַּם דִּינָה הוֹלֶכֶת לַקּוֹנְצֶרְט?"
      4: "לֹא."
      5: "לְאָן הִיא הוֹלֶכֶת?"
