gramatica:
  - id: eifo-meayin
    titol: On? D'on?
    explicacio: "אֵיפֹה? pregunta pel lloc on és algú i מֵאַיִן? per la procedència. Si la resposta porta בְּ־, la pregunta és אֵיפֹה; si porta מִ־, és מֵאַיִן."
    exemples:
      - { n: "אֵיפֹה אַתֶּם עַכְשָׁיו? — עַכְשָׁיו אֲנַחְנוּ בְּיִשְׂרָאֵל.", ca: "On sou ara? — Ara som a Israel." }
      - { n: "אֵיפֹה קִרְיַת-שְׁמוֹנָה? — קִרְיַת-שְׁמוֹנָה בַּגָּלִיל.", ca: "On és Kiryat Shmona? — Kiryat Shmona és a Galilea." }
      - { n: "יִצְחָק, מֵאַיִן אַתָּה וְשָׂרָה? — אֲנַחְנוּ מִבְּרָזִיל.", ca: "Itshak, d'on sou tu i la Sara? — Som del Brasil." }
  - id: be-ba
    titol: La preposició בְּ־ i l'article
    explicacio: "בְּ־ (a, en) s'enganxa al mot. Si el mot porta l'article, la ה cau i en queda la vocal: בְּ + הַ = בַּ. Les ciutats i els països no porten article; la Galilea, sí."
    exemples:
      - { n: "אֶסְתֵּר בְּחֵיפָה.", ca: "L'Ester és a Haifa." }
      - { n: "בְּקִיבּוּץ · בַּקִּיבּוּץ", ca: "en un quibuts · al quibuts" }
      - { n: "גַּם קִיבּוּץ דָּן בַּגָּלִיל.", ca: "El quibuts Dan també és a Galilea." }
      - { n: "עַכְשָׁיו מִשְׁפַּחַת לֵוִי בָּאָרֶץ.", ca: "Ara la família Leví és a Israel (literalment, al país)." }
  - id: present
    titol: El present en quatre formes
    explicacio: "En present el verb canvia per gènere i nombre, no per persona, i per això el pronom és obligatori. Les terminacions són les dels adjectius; al plural, la e de dins cau (לוֹמֵד → לוֹמְדִים)."
    exemples:
      - { n: "גָּר, גָּרָה, גָּרִים, גָּרוֹת", ca: "viu, viu, viuen, viuen (m. sg., f. sg., m. pl., f. pl.)" }
      - { n: "לוֹמֵד, לוֹמֶדֶת, לוֹמְדִים, לוֹמְדוֹת", ca: "estudia, estudia, estudien, estudien (m. sg., f. sg., m. pl., f. pl.)" }
      - { n: "עוֹבֵד, עוֹבֶדֶת, עוֹבְדִים, עוֹבְדוֹת", ca: "treballa, treballa, treballen, treballen (m. sg., f. sg., m. pl., f. pl.)" }
      - { n: "אֲנִי לוֹמֵד בָּאוּלְפָּן.", ca: "Estudio a l'ulpan (parla un home)." }
      - { n: "הִיא לֹא עוֹבֶדֶת, הִיא לוֹמֶדֶת.", ca: "No treballa, estudia." }
  - id: oseh
    titol: עוֹשֶׂה, «fa»
    explicacio: "עוֹשֶׂה fa el femení en ‑ָה, com מוֹרֶה. Sense vocals, עושה serveix per als dos gèneres i el context decideix."
    exemples:
      - { n: "עוֹשֶׂה, עוֹשָׂה, עוֹשִׂים, עוֹשׂוֹת", ca: "fa, fa, fan, fan (m. sg., f. sg., m. pl., f. pl.)" }
      - { n: "מָה עוֹשֶׂה רוֹבֶּרְטוֹ?", ca: "Què fa el Roberto?" }
      - { n: "מָה עוֹשָׂה אֶסְתֵּר?", ca: "Què fa l'Ester?" }
      - { n: "מָה אַתְּ עוֹשָׂה?", ca: "Què fas? (a una dona)", extra: true }
  - id: ordre-pregunta
    titol: L'ordre a la pregunta
    explicacio: "Després de la partícula interrogativa, el verb sovint passa davant del subjecte, però no si el subjecte és un pronom; a la resposta torna l'ordre de sempre. Dos verbs seguits s'uneixen amb וְ־."
    exemples:
      - { n: "וְאֵיפֹה לוֹמֵד רוֹבֶּרְטוֹ?", ca: "I on estudia el Roberto?" }
      - { n: "מָה עוֹשִׂים שָׂרָה וְיִצְחָק?", ca: "Què fan la Sara i l'Itshak?" }
      - { n: "רוֹבֶּרְטוֹ עוֹבֵד וְלוֹמֵד בַּקִּיבּוּץ.", ca: "El Roberto treballa i estudia al quibuts." }
      - { n: "אֵיפֹה אַתָּה גָּר?", ca: "On vius?" }
  - id: nombres
    titol: Els nombres del 0 al 10
    explicacio: "El dossier dona els nombres en femení, que és la forma per comptar i per dir xifres soltes (telèfons, adreces, autobusos). מִסְפָּר va davant de la xifra, com en català."
    exemples:
      - { n: "אֶפֶס, אַחַת, שְׁתַּיִם, שָׁלוֹשׁ, אַרְבַּע, חָמֵשׁ", ca: "zero, u, dos, tres, quatre, cinc" }
      - { n: "שֵׁשׁ, שֶׁבַע, שְׁמוֹנֶה, תֵּשַׁע, עֶשֶׂר", ca: "sis, set, vuit, nou, deu" }
      - { n: "הֵן גָּרוֹת בִּרְחוֹב הָאוֹרֶן מִסְפָּר 7 (שֶׁבַע).", ca: "Viuen al carrer Haoren, número 7 (set)." }
      - { n: "228071: שְׁתַּיִם, שְׁתַּיִם, שְׁמוֹנֶה, אֶפֶס, שֶׁבַע, אַחַת", ca: "El telèfon del Moixè, xifra a xifra." }
      - { n: "זֶה אוֹטוֹבּוּס מִסְפָּר 9.", ca: "És l'autobús número 9." }
  - id: mispar-constructe
    titol: מִסְפַּר הַטֶּלֶפוֹן
    explicacio: "Davant d'un altre nom, מִסְפָּר pren la forma מִסְפַּר i no porta article; l'article va al segon nom. És la construcció de מִשְׁפַּחַת לֵוִי."
    exemples:
      - { n: "מִסְפַּר הַטֶּלֶפוֹן שֶׁל מֹשֶׁה", ca: "el número de telèfon del Moixè" }
      - { n: "מִשְׁפַּחַת לֵוִי", ca: "la família Leví" }
  - id: nombres-masculins
    titol: Els nombres amb un nom masculí
    extra: true
    explicacio: "Amb un nom masculí es fa servir una altra sèrie, i del 3 al 10 és la que acaba en ‑ָה, al revés que els adjectius. אֶחָד i אַחַת van darrere del nom; el 2, davant i en la forma שְׁנֵי (m.) o שְׁתֵּי (f.); del 3 al 10, davant tal com són."
    exemples:
      - { u: "אחד, שניים, שלושה, ארבעה, חמישה", n: "אֶחָד, שְׁנַייִם, שְׁלוֹשָׁה, אַרְבָּעָה, חֲמִישָּׁה", ca: "de l'1 al 5, amb un nom masculí", extra: true }
      - { u: "שישה, שבעה, שמונה, תשעה, עשרה", n: "שִׁישָּׁה, שִׁבְעָה, שְׁמוֹנָה, תִּשְׁעָה, עֲשָׂרָה", ca: "del 6 al 10, amb un nom masculí", extra: true }
      - { n: "סֵפֶר אֶחָד · תְּמוּנָה אַחַת", ca: "un llibre · una imatge", extra: true }
      - { u: "שני ספרים · שתי תמונות", n: "שְׁנֵי סְפָרִים · שְׁתֵּי תְּמוּנוֹת", ca: "dos llibres · dues imatges", extra: true }
      - { u: "שלושה ספרים · שלוש תמונות", n: "שְׁלוֹשָׁה סְפָרִים · שָׁלוֹשׁ תְּמוּנוֹת", ca: "tres llibres · tres imatges", extra: true }
      - { n: "שְׁמוֹנָה · שְׁמוֹנֶה", ca: "vuit (m.) · vuit (f.): sense vocals, s'escriuen igual", extra: true }

exercicis:
  # pag-16, תרגיל 5: מִי, מַה, מֵאַיִן o אֵיפֹה
  - { tipus: forat, origen: "pag-16 ex. 5.1", extra: false, linies: [pag-16-b1-l0],
      frase: { u: "____ אתה? — אני סטיב.", n: "____ אַתָּה? — אֲנִי סְטִיב." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 0, retro: "Respon amb el nom: es pregunta qui és, מִי." }
  - { tipus: forat, origen: "pag-16 ex. 5.2", extra: false, linies: [pag-16-b1-l1],
      frase: { u: "____ אתה? — אני מאנגליה.", n: "____ אַתָּה? — אֲנִי מֵאַנְגְלִיָּה." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 2, retro: "La resposta porta מִ־ (d'Anglaterra): מֵאַיִן." }
  - { tipus: forat, origen: "pag-16 ex. 5.3", extra: false, linies: [pag-16-b1-l2],
      frase: { u: "____ אתה עכשיו? — בישראל.", n: "____ אַתָּה עַכְשָׁיו? — בְּיִשְׂרָאֵל." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 3, retro: "La resposta porta בְּ־ (a Israel): אֵיפֹה." }
  - { tipus: forat, origen: "pag-16 ex. 5.4", extra: false, linies: [pag-16-b1-l3],
      frase: { u: "____ אילת? — בישראל.", n: "____ אֵילַת? — בְּיִשְׂרָאֵל." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 3, retro: "Es pregunta on és una ciutat; la resposta porta בְּ־: אֵיפֹה." }
  - { tipus: forat, origen: "pag-16 ex. 5.5", extra: false, linies: [pag-16-b1-l4],
      frase: { u: "____ יוהנסבורג? — בדרום-אפריקה." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 3, retro: "La resposta porta בְּ־ (a Sud-àfrica): אֵיפֹה." }
  - { tipus: forat, origen: "pag-16 ex. 5.6", extra: false, linies: [pag-16-b1-l5],
      frase: { u: "____ סם? — מדרום-אפריקה.", n: "____ סָם? — מִדְּרוֹם-אַפְרִיקָה." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 2, retro: "La resposta porta מִ־ (de Sud-àfrica): מֵאַיִן." }
  - { tipus: forat, origen: "pag-16 ex. 5.7", extra: false, linies: [pag-16-b1-l6],
      frase: { u: "____ מברזיל? — רוברטו מברזיל.", n: "____ מִבְּרָזִיל? — רוֹבֶּרְטוֹ מִבְּרָזִיל." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 0, retro: "Es pregunta quina persona és del Brasil: מִי." }
  - { tipus: forat, origen: "pag-16 ex. 5.8", extra: false, linies: [pag-16-b1-l7],
      frase: { u: "____ עמנואל? — עמנואל מברזיל.", n: "____ עִמָּנוּאֵל? — עִמָּנוּאֵל מִבְּרָזִיל." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 2, retro: "La resposta diu d'on és, amb מִ־: מֵאַיִן." }
  - { tipus: forat, origen: "pag-16 ex. 5.9", extra: false, linies: [pag-16-b1-l8],
      frase: { u: "____ זה? — זה ספר.", n: "____ זֶה? — זֶה סֵפֶר." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 1, retro: "Un llibre és una cosa: מַה." }
  - { tipus: forat, origen: "pag-16 ex. 5.10", extra: false, linies: [pag-16-b1-l9],
      frase: { u: "____ המורה של יצחק? — צפורה.", n: "____ הַמּוֹרָה שֶׁל יִצְחָק? — צִפּוֹרָה." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 0, retro: "La resposta és una persona: מִי." }
  - { tipus: forat, origen: "pag-16 ex. 5.11", extra: false, linies: [pag-16-b1-l10],
      frase: { u: "____ המורה של יצחק? — מישראל.", n: "____ הַמּוֹרָה שֶׁל יִצְחָק? — מִיִּשְׂרָאֵל." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 2, retro: "La resposta porta מִ־ (d'Israel): מֵאַיִן." }
  - { tipus: forat, origen: "pag-16 ex. 5.12", extra: false, linies: [pag-16-b1-l11],
      frase: { u: "____ המורה? — באולפן.", n: "____ הַמּוֹרָה? — בָּאוּלְפָּן." },
      opcions: ["מִי", "מַה", "מֵאַיִן", "אֵיפֹה"], correcta: 3, retro: "La resposta porta בְּ־ (a l'ulpan): אֵיפֹה." }

  # pag-16, תרגיל 6: וְ־, בְּ־, מִ־ o הַ־
  - { tipus: autocorreccio, origen: "pag-16 ex. 6.1", extra: false, linies: [pag-16-b3-l0],
      enunciat: { n: "רוֹבֶּרְטוֹ ____אֶסְתֵּר אָח ____אָחוֹת. הֵם עוֹלִים חֲדָשִׁים ____בְּרָזִיל.", u: "רוברטו ____אסתר אח ____אחות. הם עולים חדשים ____ברזיל." },
      model: { n: "רוֹבֶּרְטוֹ וְאֶסְתֵּר אָח וְאָחוֹת. הֵם עוֹלִים חֲדָשִׁים מִבְּרָזִיל.", u: "רוברטו ואסתר אח ואחות. הם עולים חדשים מברזיל." } }
  - { tipus: forat, origen: "pag-16 ex. 6.2", extra: false, linies: [pag-16-b3-l1],
      frase: { u: "ירושלים לא באנגליה. ירושלים ____ישראל.", n: "יְרוּשָׁלַיִם לֹא בְּאַנְגְלִיָּה. יְרוּשָׁלַיִם ____יִשְׂרָאֵל." },
      opcions: ["וְ־", "בְּ־", "מִ־", "הַ־"], correcta: 1, retro: "Es diu on és Jerusalem: בְּ־." }
  - { tipus: forat, origen: "pag-16 ex. 6.3", extra: false, linies: [pag-16-b3-l2],
      frase: { u: "זה לא ____ארגנטינה, זה מרוסיה.", n: "זֶה לֹא ____אַרְגֶּנְטִינָה, זֶה מֵרוּסְיָה." },
      opcions: ["וְ־", "בְּ־", "מִ־", "הַ־"], correcta: 2, retro: "Fa parella amb מֵרוּסְיָה: és procedència, מִ־ (aquí מֵאַרְגֶּנְטִינָה)." }
  - { tipus: autocorreccio, origen: "pag-16 ex. 6.4", extra: false, linies: [pag-16-b3-l3],
      enunciat: { n: "____הוֹרִים שֶׁל רוֹבֶּרְטוֹ תַּלְמִידִים ____אוּלְפָּן ____קִרְיַת-שְׁמוֹנָה.", u: "____הורים של רוברטו תלמידים ____אולפן ____קרית-שמונה." },
      model: { n: "הַהוֹרִים שֶׁל רוֹבֶּרְטוֹ תַּלְמִידִים בָּאוּלְפָּן בְּקִרְיַת-שְׁמוֹנָה.", u: "ההורים של רוברטו תלמידים באולפן בקרית-שמונה." } }
  - { tipus: forat, origen: "pag-16 ex. 6.5", extra: false, linies: [pag-16-b3-l4],
      frase: { u: "סטיב ודוריס תיירים מאנגליה. עכשיו הם ____ישראל.", n: "סְטִיב וְדוֹרִיס תַּייָּרִים מֵאַנְגְלִיָּה. עַכְשָׁיו הֵם ____יִשְׂרָאֵל." },
      opcions: ["וְ־", "בְּ־", "מִ־", "הַ־"], correcta: 1, retro: "Ara són en un lloc: בְּ־." }
  - { tipus: forat, origen: "pag-16 ex. 6.6", extra: false, linies: [pag-16-b3-l5],
      frase: { u: "____ילדים של צפורה גדולים ויפים.", n: "____יְלָדִים שֶׁל צִפּוֹרָה גְּדוֹלִים וְיָפִים." },
      opcions: ["וְ־", "בְּ־", "מִ־", "הַ־"], correcta: 3, retro: "El nom que va davant de שֶׁל porta article: הַ־." }

  # pag-18, תרגיל 7: canvia el mot destacat i fes concordar el verb
  - { tipus: conjugar, origen: "pag-18 ex. 7.1", extra: false, linies: [pag-18-b3-l0, pag-18-b3-l1],
      base: { n: "הוּא גָּר בִּירוּשָׁלַיִם. הוּא לוֹמֵד. הוּא לֹא עוֹבֵד.", u: "הוא גר בירושלים. הוא לומד. הוא לא עובד." }, demana: "amb רָחֵל",
      opcions: ["רָחֵל גָּרָה בִּירוּשָׁלַיִם. הִיא לוֹמֶדֶת. הִיא לֹא עוֹבֶדֶת.", "רָחֵל גָּר בִּירוּשָׁלַיִם. הִיא לוֹמֵד. הִיא לֹא עוֹבֵד.", "רָחֵל גָּרוֹת בִּירוּשָׁלַיִם. הִיא לוֹמְדוֹת. הִיא לֹא עוֹבְדוֹת."], correcta: 0 }
