# Capa curada de la unitat 3: icones, textos, gramàtica, exercicis.
# Format: vegeu scripts/genera-contingut.ts (tipus Curat).
# Vocals verificades amb els TSV i la fitxa u03-on-vius-i-que-fas del dossier i amb Pealim
# (אוּנִיבֶרְסִיטָה, פְּסִיכוֹלוֹגְיָה, אוֹטוֹבּוּס, els nombres masculins de l'extra).
# Prefixos amb la vocal estàndard: בָּאוּלְפָּן (com el dossier fa a בָּאָרֶץ i בָּאוניברסיטה),
# בִּרְחוֹב, בִּירוּשָׁלַיִם (com la fitxa i la pàg. 56). Vegeu l'informe de la tasca.
# Sense vocals (no confirmades): pag-16-b1-l4 (יוהנסבורג), pag-17-b0-l20 (סוציולוגיה),
# pag-18-b2-l0 (תרגיל המרה).

textos:
  pag-15-b0:
    vocals:
      0: "יִצְחָק, מֵאַיִן אַתָּה וְשָׂרָה? — אֲנַחְנוּ מִבְּרָזִיל."
      1: "אֵיפֹה אַתֶּם עַכְשָׁיו? — עַכְשָׁיו אֲנַחְנוּ בְּיִשְׂרָאֵל."
      2: "בְּמֶרְכַּז-קְלִיטָה בְּקִרְיַת-שְׁמוֹנָה."
      3: "אֵיפֹה קִרְיַת-שְׁמוֹנָה? — קִרְיַת-שְׁמוֹנָה בַּגָּלִיל."
      4: "וְאֵיפֹה רוֹבֶּרְטוֹ? — רוֹבֶּרְטוֹ בָּאוּלְפָּן בְּקִיבּוּץ דָּן."
      5: "גַּם קִיבּוּץ דָּן בַּגָּלִיל? — כֵּן, גַּם קִיבּוּץ דָּן בַּגָּלִיל."
      6: "גַּם אֶסְתֵּר בְּקִיבּוּץ? — לֹא, אֶסְתֵּר בְּחֵיפָה."
      7: "הִיא סְטוּדֶנְטִית בָּאוּנִיבֶרְסִיטָה"
      8: "בְּחֵיפָה."
    ca:
      0: "Itshak, d'on sou tu i la Sara? — Som del Brasil."
      1: "On sou ara? — Ara som a Israel."
      2: "En un centre d'acollida, a Kiryat Shmona."
      3: "On és Kiryat Shmona? — Kiryat Shmona és a Galilea."
      4: "I on és el Roberto? — El Roberto és a l'ulpan, al quibuts Dan."
      5: "El quibuts Dan també és a Galilea? — Sí, el quibuts Dan també és a Galilea."
      6: "L'Ester també és en un quibuts? — No, l'Ester és a Haifa."
