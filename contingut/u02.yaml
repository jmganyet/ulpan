# Capa curada de la unitat 2: icones, textos, gramàtica, exercicis.
# Format: vegeu scripts/genera-contingut.ts (tipus Curat).
# Vocals verificades amb els TSV i la fitxa u02-demostratius-i-familia del dossier i amb Pealim;
# grafia plena amb vocals (R19): אִישָּׁה, מְעַנְייֵן, מְעַנְייֶנֶת, מְעַנְייְנִים, מְעַנְייְנוֹת (Pealim).
# Les línies «per comprovar» (⁇) no porten vocals ni traducció.

