gramatica:
  - id: demostratius
    titol: Els demostratius
    explicacio: זֶה (masculí) i זֹאת (femení) són del singular; אֵלֶּה serveix per als dos gèneres en plural. Sense verb «ser», זֶה יֶלֶד ja és una frase sencera.
    exemples:
      - { n: "זֶה יֶלֶד", ca: "Aquest és un nen." }
      - { n: "זֹאת יַלְדָּה", ca: "Aquesta és una nena." }
      - { n: "אֵלֶּה יְלָדִים", ca: "Aquests són nens." }
      - { n: "אֵלֶּה נָשִׁים", ca: "Aquestes són dones." }
  - id: ma-mi
    titol: Què és? Qui és?
    explicacio: מַה? pregunta per coses i מִי? per persones. Per a coses es diu sempre מַה זֶּה?, encara que la resposta sigui femenina.
    exemples:
      - { n: "מַה זֶּה? — זֶה סֵפֶר.", ca: "Què és això? — És un llibre." }
      - { n: "מַה זֶּה? — זֹאת תְּמוּנָה.", ca: "Què és això? — És un quadre." }
      - { n: "מִי זֶה? — זֶה אָדוֹן יִצְחָק לֵוִי.", ca: "Qui és? — És el senyor Itshak Leví." }
      - { n: "מִי זֹאת? — הָאָחוֹת שֶׁל רוֹבֶּרְטוֹ.", ca: "Qui és? — La germana del Roberto." }
      - { n: "הַתְּמוּנָה יָפָה? — כָּכָה-כָּכָה.", ca: "El quadre és bonic? — Així així." }
  - id: adjectiu-quatre-formes
    titol: L'adjectiu en quatre formes
    explicacio: Les terminacions són les de la unitat 1, i sovint s'escurça la primera vocal (גָּדוֹל → גְּדוֹלָה). Sense vocals, יפה és igual en masculí i femení; מעניין s'escriu amb dues י, i amb vocals el dossier en posa una (מְעַנְיֵן).
    exemples:
      - { n: "גָּדוֹל, גְּדוֹלָה, גְּדוֹלִים, גְּדוֹלוֹת", ca: "gran (m. sg., f. sg., m. pl., f. pl.)" }
      - { n: "קָטָן, קְטַנָּה, קְטַנִּים, קְטַנּוֹת", ca: "petit, petita, petits, petites" }
      - { n: "יָפֶה, יָפָה, יָפִים, יָפוֹת", ca: "bonic, bonica, bonics, boniques" }
      - { u: "מעניין, מעניינת, מעניינים, מעניינות", n: "מְעַנְייֵן, מְעַנְייֶנֶת, מְעַנְייְנִים, מְעַנְייְנוֹת", ca: "interessant (m. sg., f. sg., m. pl., f. pl.)" }
      - { n: "אֵלֶּה יְלָדוֹת קְטַנּוֹת.", ca: "Aquestes són nenes petites." }
  - id: nom-amb-article
    titol: Nom amb article i adjectiu sense
    explicacio: Si el nom porta הַ־ i l'adjectiu no, és una frase amb «ser» sobreentès. לֹא va davant del que es nega.
    exemples:
      - { n: "הַסֵּפֶר מְעַנְייֵן מְאוֹד.", ca: "El llibre és molt interessant." }
      - { n: "הַתְּמוּנָה לֹא יָפָה.", ca: "El quadre no és bonic." }
      - { n: "זֹאת לֹא תְּמוּנָה קְטַנָּה.", ca: "No és un quadre petit." }
      - { n: "הַסְּפָרִים שֶׁל יִצְחָק לֹא חֲדָשִׁים.", ca: "Els llibres de l'Itshak no són nous.", extra: true }
  - id: plurals
    titol: Plurals que s'han d'aprendre
    explicacio: Molts noms canvien les vocals en plural, i alguns canvien sencers. נָשִׁים és femení encara que acabi en ‑ִים.
    exemples:
      - { n: "יֶלֶד, יְלָדִים · סֵפֶר, סְפָרִים", ca: "nen, nens · llibre, llibres" }
      - { n: "אִישׁ, אֲנָשִׁים · אִישָּׁה, נָשִׁים", ca: "home, homes · dona, dones" }
      - { n: "בֵּן, בָּנִים · בַּת, בָּנוֹת", ca: "fill, fills · filla, filles" }
      - { n: "אָח, אַחִים · אָחוֹת, אֲחָיוֹת", ca: "germà, germans · germana, germanes" }
      - { n: "הֵן נָשִׁים טוֹבוֹת.", ca: "Són bones dones." }
  - id: familia-shel
    titol: La família amb שֶׁל
    explicacio: El nom de parentiu que va davant de שֶׁל porta article (הַבַּעַל, הָאָח), però אַבָּא i אִמָּא van sense. Davant de cada nom es repeteix שֶׁל.
    exemples:
      - { n: "הוּא הַבַּעַל שֶׁל שָׂרָה.", ca: "És el marit de la Sara." }
      - { n: "הִיא הַבַּת שֶׁל שָׂרָה וְיִצְחָק.", ca: "És la filla de la Sara i l'Itshak." }
      - { n: "הוּא אַבָּא שֶׁל רוֹבֶּרְטוֹ.", ca: "És el pare del Roberto." }
      - { n: "הֵם הַהוֹרִים שֶׁל רוֹבֶּרְטוֹ וְשֶׁל אֶסְתֵּר.", ca: "Són els pares del Roberto i de l'Ester." }
      - { n: "יִצְחָק לֵוִי - בַּעַל.", ca: "L'Itshak Leví és marit (el guió fa de «ser»)." }
  - id: mishpakhat
    titol: מִשְׁפַּחַת i la presentació
    explicacio: מִשְׁפָּחָה pren la forma מִשְׁפַּחַת quan va enganxada a un altre nom. בְּבַקָּשָׁה לְהַכִּיר és la fórmula per presentar algú.
    exemples:
      - { n: "זֹאת מִשְׁפַּחַת לֵוִי.", ca: "Aquesta és la família Leví." }
      - { n: "זֹאת מִשְׁפָּחָה שֶׁל עוֹלִים חֲדָשִׁים מִבְּרָזִיל.", ca: "És una família d'immigrants nous del Brasil." }
      - { n: "בְּבַקָּשָׁה לְהַכִּיר: מִשְׁפַּחַת לֵוִי.", ca: "Us presento la família Leví." }

exercicis:
  # pag-14, תרגיל 4: מִי o מַה
  - { tipus: forat, origen: "pag-14 ex. 4.1", extra: false, linies: [pag-14-b4-l0],
      frase: { u: "____ זה? — יצחק.", n: "____ זֶה? — יִצְחָק." },
      opcions: ["מִי", "מַה"], correcta: 0, retro: "La resposta és una persona: מִי." }
  - { tipus: forat, origen: "pag-14 ex. 4.2", extra: false, linies: [pag-14-b4-l1],
      frase: { u: "____ הוא? — תלמיד.", n: "____ הוּא? — תַּלְמִיד." },
      opcions: ["מִי", "מַה"], correcta: 1, retro: "No es pregunta qui és, sinó què és: מַה." }
  - { tipus: forat, origen: "pag-14 ex. 4.3", extra: false, linies: [pag-14-b4-l2],
      frase: { u: "____ היא? — שרה.", n: "____ הִיא? — שָׂרָה." },
      opcions: ["מִי", "מַה"], correcta: 0, retro: "La resposta és una persona: מִי." }
  - { tipus: forat, origen: "pag-14 ex. 4.4", extra: false, linies: [pag-14-b4-l3],
      frase: { u: "____ זה? — זאת תמונה.", n: "____ זֶה? — זֹאת תְּמוּנָה." },
      opcions: ["מִי", "מַה"], correcta: 1, retro: "Un quadre és una cosa: מַה." }
  - { tipus: forat, origen: "pag-14 ex. 4.5", extra: false, linies: [pag-14-b4-l4],
      frase: { u: "____ תלמיד? — רוברטו.", n: "____ תַּלְמִיד? — רוֹבֶּרְטוֹ." },
      opcions: ["מִי", "מַה"], correcta: 0, retro: "Es pregunta quina persona és alumne: מִי." }
  - { tipus: forat, origen: "pag-14 ex. 4.6", extra: false, linies: [pag-14-b4-l5],
      frase: { u: "____ מורה? — יוסף.", n: "____ מוֹרֶה? — יוֹסֵף." },
      opcions: ["מִי", "מַה"], correcta: 0, retro: "Es pregunta quina persona és mestre: מִי." }
  - { tipus: forat, origen: "pag-14 ex. 4.7", extra: false, linies: [pag-14-b4-l6],
      frase: { u: "____ זה? — הספר של רוברטו.", n: "____ זֶה? — הַסֵּפֶר שֶׁל רוֹבֶּרְטוֹ." },
      opcions: ["מִי", "מַה"], correcta: 1, retro: "Un llibre és una cosa: מַה." }
  - { tipus: forat, origen: "pag-14 ex. 4.8", extra: false, linies: [pag-14-b4-l7],
      frase: { u: "____ זה? — אבא של רוברטו.", n: "____ זֶה? — אַבָּא שֶׁל רוֹבֶּרְטוֹ." },
      opcions: ["מִי", "מַה"], correcta: 0, retro: "El pare és una persona: מִי." }
  - { tipus: forat, origen: "pag-14 ex. 4.9", extra: false, linies: [pag-14-b4-l8],
      frase: { u: "____ זאת? — האחות של רוברטו.", n: "____ זֹאת? — הָאָחוֹת שֶׁל רוֹבֶּרְטוֹ." },
      opcions: ["מִי", "מַה"], correcta: 0, retro: "La germana és una persona: מִי." }

  # pag-14, תרגיל 3: canvia el mot destacat i fes concordar la frase
  - { tipus: construir, origen: "pag-14 ex. 3.1", extra: false, linies: [pag-14-b2-l0],
      ca: "És un llibre interessant.",
      fitxes: ["סֵפֶר", "מְעַנְייֶנֶת", "זֶה", "מְעַנְייֵן", "זֹאת"], ordre: [2, 0, 3] }
  - { tipus: conjugar, origen: "pag-14 ex. 3.2", extra: false, linies: [pag-14-b2-l1],
      base: { n: "הוּא יֶלֶד יָפֶה.", u: "הוא ילד יפה." }, demana: "amb הִיא",
      opcions: ["הִיא יֶלֶד יָפָה.", "הִיא יַלְדָּה יָפָה.", "הִיא יְלָדוֹת יָפוֹת."], correcta: 1 }
  - { tipus: conjugar, origen: "pag-14 ex. 3.2", extra: false, linies: [pag-14-b2-l1],
      base: { n: "הוּא יֶלֶד יָפֶה.", u: "הוא ילד יפה." }, demana: "amb הֵם",
      opcions: ["הֵם יְלָדִים יָפוֹת.", "הֵם יְלָדוֹת יָפוֹת.", "הֵם יְלָדִים יָפִים."], correcta: 2 }
  - { tipus: autocorreccio, origen: "pag-14 ex. 3.2", extra: false, linies: [pag-14-b2-l1],
      enunciat: { n: "הוּא יֶלֶד יָפֶה. ← הֵן", u: "הוא ילד יפה. ← הן" },
      model: { n: "הֵן יְלָדוֹת יָפוֹת.", u: "הן ילדות יפות." } }
  - { tipus: forat, origen: "pag-14 ex. 3.3", extra: false, linies: [pag-14-b2-l2],
      frase: { u: "התמונה לא ____.", n: "הַתְּמוּנָה לֹא ____." },
      opcions: ["מְעַנְייֵן", "מְעַנְייֶנֶת", "מְעַנְייְנִים", "מְעַנְייְנוֹת"], correcta: 1, retro: "תְּמוּנָה és femení singular: מְעַנְייֶנֶת." }
  - { tipus: forat, origen: "pag-14 ex. 3.4", extra: false, linies: [pag-14-b2-l3],
      frase: { u: "הספרים של יצחק ____.", n: "הַסְּפָרִים שֶׁל יִצְחָק ____." },
      opcions: ["קְטַנָּה", "קְטַנִּים", "קְטַנּוֹת", "קָטָן"], correcta: 1, retro: "סְפָרִים és masculí plural: קְטַנִּים." }
  - { tipus: conjugar, origen: "pag-14 ex. 3.5", extra: false, linies: [pag-14-b2-l4],
      base: { n: "הִיא לֹא יָפָה, אֲבָל הִיא מְעַנְייֶנֶת.", u: "היא לא יפה, אבל היא מעניינת." }, demana: "amb הֵן",
      opcions: ["הֵן לֹא יָפִים, אֲבָל הֵן מְעַנְייְנִים.", "הֵן לֹא יָפָה, אֲבָל הֵן מְעַנְייֶנֶת.", "הֵן לֹא יָפוֹת, אֲבָל הֵן מְעַנְייְנוֹת."], correcta: 2 }
  - { tipus: autocorreccio, origen: "pag-14 ex. 3.5", extra: false, linies: [pag-14-b2-l4],
      enunciat: { n: "הִיא לֹא יָפָה, אֲבָל הִיא מְעַנְייֶנֶת. ← הוּא", u: "היא לא יפה, אבל היא מעניינת. ← הוא" },
      model: { n: "הוּא לֹא יָפֶה, אֲבָל הוּא מְעַנְייֵן.", u: "הוא לא יפה, אבל הוא מעניין." } }
  - { tipus: conjugar, origen: "pag-14 ex. 3.6", extra: false, linies: [pag-14-b2-l5],
      base: { n: "הִיא אִישָּׁה מְעַנְייֶנֶת.", u: "היא אישה מעניינת." }, demana: "amb צִפּוֹרָה וְשָׂרָה",
      opcions: ["צִפּוֹרָה וְשָׂרָה נָשִׁים מְעַנְייְנִים.", "צִפּוֹרָה וְשָׂרָה נָשִׁים מְעַנְייְנוֹת.", "צִפּוֹרָה וְשָׂרָה אֲנָשִׁים מְעַנְייְנִים."], correcta: 1 }
  - { tipus: conjugar, origen: "pag-14 ex. 3.6", extra: false, linies: [pag-14-b2-l5],
      base: { n: "הִיא אִישָּׁה מְעַנְייֶנֶת.", u: "היא אישה מעניינת." }, demana: "amb הֵם",
      opcions: ["הֵם אֲנָשִׁים מְעַנְייְנִים.", "הֵם אֲנָשִׁים מְעַנְייְנוֹת.", "הֵם נָשִׁים מְעַנְייְנוֹת."], correcta: 0 }
  - { tipus: autocorreccio, origen: "pag-14 ex. 3.6", extra: false, linies: [pag-14-b2-l5],
      enunciat: { n: "הִיא אִישָּׁה מְעַנְייֶנֶת. ← הוּא", u: "היא אישה מעניינת. ← הוא" },
      model: { n: "הוּא אִישׁ מְעַנְייֵן.", u: "הוא איש מעניין." } }
  - { tipus: construir, origen: "pag-14 ex. 3.7", extra: false, linies: [pag-14-b2-l6],
      ca: "És el germà de la Sara.",
      fitxes: ["שֶׁל", "הָאָח", "שָׂרָה", "הוּא", "הָאָחוֹת"], ordre: [3, 1, 0, 2] }
  - { tipus: construir, origen: "pag-14 ex. 3.8", extra: false, linies: [pag-14-b2-l7],
      ca: "La filla de l'Itshak és bonica.",
      fitxes: ["יָפָה", "שֶׁל", "הַבַּת", "יִצְחָק", "הַבֵּן"], ordre: [2, 1, 3, 0] }
  - { tipus: conjugar, origen: "pag-14 ex. 3.9", extra: false, linies: [pag-14-b2-l8],
      base: { n: "הַבַּעַל שֶׁל שָׂרָה יָפֶה.", u: "הבעל של שרה יפה." }, demana: "amb הַיְּלָדִים",
      opcions: ["הַיְּלָדִים שֶׁל שָׂרָה יָפֶה.", "הַיְּלָדִים שֶׁל שָׂרָה יָפִים.", "הַיְּלָדִים שֶׁל שָׂרָה יָפוֹת."], correcta: 1 }
  - { tipus: forat, origen: "pag-14 ex. 3.10", extra: false, linies: [pag-14-b2-l9],
      frase: { u: "הן נשים ____.", n: "הֵן נָשִׁים ____." },
      opcions: ["יָפִים", "יָפוֹת", "יָפָה"], correcta: 1, retro: "נָשִׁים és femení encara que acabi en ‑ִים: יָפוֹת." }

  # Extra: comprensió i producció a partir dels textos
  - { tipus: comprensio, origen: extra, extra: true, linies: [pag-11-b0-l0, pag-11-b0-l1, pag-11-b0-l2, pag-11-b0-l3, pag-11-b0-l4, pag-11-b0-l5],
      text: "מַה זֶּה? — זֶה סֵפֶר. — זֶה סֵפֶר קָטָן? — לֹא, זֶה סֵפֶר גָּדוֹל. — הַסֵּפֶר מְעַנְייֵן? — כֵּן, הַסֵּפֶר מְעַנְייֵן מְאוֹד.",
      pregunta: "Com és el llibre?", opcions: ["Petit i interessant", "Gran i molt interessant", "Gran i no gaire interessant"], correcta: 1 }
  - { tipus: comprensio, origen: extra, extra: true, linies: [pag-11-b1-l3, pag-11-b1-l4, pag-11-b1-l5, pag-11-b1-l6],
      text: "לֹא, זֹאת לֹא תְּמוּנָה קְטַנָּה. זֹאת תְּמוּנָה גְּדוֹלָה. — הַתְּמוּנָה יָפָה? — כָּכָה - כָּכָה.",
      pregunta: "El quadre és bonic?", opcions: ["Sí, molt", "Així així", "No, gens"], correcta: 1 }
  - { tipus: comprensio, origen: extra, extra: true, linies: [pag-13-b0-l0, pag-13-b0-l1, pag-13-b0-l2],
      text: "הֵם רוֹבֶּרְטוֹ וְאֶסְתֵּר. אֵלֶּה הַיְּלָדִים שֶׁל שָׂרָה וְיִצְחָק. אֶסְתֵּר - בַּת. הִיא הַבַּת שֶׁל שָׂרָה וְיִצְחָק. רוֹבֶּרְטוֹ - בֵּן. הוּא הַבֵּן שֶׁל שָׂרָה וְיִצְחָק.",
      pregunta: "Qui és l'Ester?", opcions: ["La mare del Roberto", "La filla de la Sara i l'Itshak", "La dona de l'Itshak"], correcta: 1 }
  - { tipus: comprensio, origen: extra, extra: true, linies: [pag-13-b1-l0, pag-13-b1-l1, pag-13-b1-l2],
      text: "שָׂרָה, יִצְחָק, אֶסְתֵּר וְרוֹבֶּרְטוֹ - מִשְׁפָּחָה. זֹאת מִשְׁפַּחַת לֵוִי. זֹאת מִשְׁפָּחָה שֶׁל עוֹלִים. זֹאת מִשְׁפָּחָה שֶׁל עוֹלִים חֲדָשִׁים מִבְּרָזִיל.",
      pregunta: "D'on és la família Leví?", opcions: ["De Rússia", "D'Anglaterra", "Del Brasil"], correcta: 2 }
  - { tipus: construir, origen: extra, extra: true, linies: [pag-10-b4-l3],
      ca: "Aquestes són nenes petites.",
      fitxes: ["קְטַנּוֹת", "אֵלֶּה", "זֹאת", "יְלָדוֹת", "קְטַנִּים"], ordre: [1, 3, 0] }
