# Capa curada de la unitat 6: icones, textos, gramàtica, exercicis.
# Format: vegeu scripts/genera-contingut.ts (tipus Curat).
# Vocals verificades amb els TSV (u01-u06) i la fitxa u06-a-la-classe del dossier, i amb Pealim
# (יוֹשֵׁב, עוֹמֵד, כּוֹתֵב, אוֹמֵר: pa'al, present, passat i infinitiu; טֶלֶווִיזְיָה, דֶּמוֹקְרַטְיָה) i Wiktionary
# (גִּיטָרָה, דִּיקְטָטוּרָה, טְרַקְטוֹר, טְרַנְזִיסְטוֹר, מֶקְסִיקוֹ).
# Grafia plena amb vocals (R19): כִּיסֵּא, כִּיסְאוֹת, עִיפָּרוֹן, מִיטָּה, כִּיתָּה, מִילִּים, מְעַנְייֵן, לַעֲמוֹד, לִכְתּוֹב.
# On el dossier escriu defectiu, s'hi segueix: הַכִּסְאוֹת (pag-36-b9), וְהָעִפָּרוֹן (pag-35-b1-l8).
# Article: הֶחָתוּל (הַ davant de חָ àtona passa a הֶ; la fitxa u06 escriu הַחָתוּל), הָאָרוֹן, הָעֵט, הָעִיפָּרוֹן, הָאִישׁ;
# הַכְּנֶסֶת amb article (בַּכְּנֶסֶת). מָה davant de א, ה, ע (מָה אוֹמֵר, מָה הֵם), com a les unitats anteriors.
# לְבּוֹרִיס amb dagesh per mantenir la b del nom estranger, com la fitxa u06 i בְּפֶבְּרוּאָר a la u05.
# Les línies «per comprovar» (⁇) no porten vocals ni traducció: pag-33-b0-l0 i pag-39-b1-l11.
# Sense vocals: pag-39-b0-l0 (תרגיל המרה, com a la u03 i la u05).
# Línies que el dossier ja dona amb vocals (pag-33-b0-l1, pag-33-b2-l0, pag-34-b2, pag-34-b7): només traducció.

