gramatica:
  - id: yesh-lloc
    titol: "יֵשׁ i אֵין amb un lloc: l'ordre és lliure"
    explicacio: "El lloc amb בְּ־ pot anar davant de יֵשׁ, entre יֵשׁ i la cosa o al final, i el sentit no canvia. La negació és sempre אֵין, mai «לֹא יֵשׁ»; לֹא queda per al «no» de la resposta."
    exemples:
      - { n: "בְּיִשְׂרָאֵל יֵשׁ קִיבּוּצִים. בְּאַנְגְלִיָּה אֵין קִיבּוּצִים.", ca: "A Israel hi ha quibutsos. A Anglaterra no hi ha quibutsos." }
      - { n: "יֵשׁ בְּיִשְׂרָאֵל קִיבּוּצִים. אֵין בְּאַנְגְלִיָּה קִיבּוּצִים.", ca: "El mateix, amb יֵשׁ i אֵין al davant." }
      - { n: "יֵשׁ קִיבּוּצִים בְּיִשְׂרָאֵל. אֵין קִיבּוּצִים בְּאַנְגְלִיָּה.", ca: "El mateix, amb el lloc al final." }
      - { n: "לֹא. גַּם טֶלֶפוֹן אֵין בַּכִּיתָּה. טֶלֶפוֹן יֵשׁ בַּמִּשְׂרָד.", ca: "No. A la classe tampoc no hi ha telèfon. Telèfon n'hi ha a l'oficina." }
      - { n: "לֹא, אֵין נֵפְט בְּיִשְׂרָאֵל.", ca: "No, a Israel no hi ha petroli.", extra: true }
  - id: plural-ot
    titol: "Masculins amb el plural en ‑וֹת"
    explicacio: "שׁוּלְחָן, כִּיסֵּא, אָרוֹן, חַלּוֹן, לוּחַ i עִיפָּרוֹן fan el plural en ‑וֹת però continuen sent masculins: l'adjectiu va en ‑ִים (חַלּוֹנוֹת גְּדוֹלִים). מַחְבֶּרֶת és femení i עֵט fa עֵטִים; sovint també canvia una vocal, i cal aprendre la parella sencera."
    exemples:
      - { n: "בַּכִּיתָּה יֵשׁ לוּחַ גָּדוֹל שָׁחוֹר, חַלּוֹנוֹת גְּדוֹלִים וְדֶלֶת.", ca: "A la classe hi ha una pissarra gran i negra, finestres grans i una porta." }
      - { n: "יֵשׁ פֹּה הַרְבֵּה כִּיסְאוֹת.", ca: "Aquí hi ha moltes cadires." }
      - { n: "שׁוּלְחָן, שׁוּלְחָנוֹת · כִּיסֵּא, כִּיסְאוֹת · אָרוֹן, אֲרוֹנוֹת", ca: "taula · cadira · armari (singular, plural)" }
      - { n: "חַלּוֹן, חַלּוֹנוֹת · לוּחַ, לוּחוֹת · עִיפָּרוֹן, עֶפְרוֹנוֹת", ca: "finestra · pissarra · llapis (singular, plural)" }
      - { n: "מַחְבֶּרֶת, מַחְבָּרוֹת · עֵט, עֵטִים", ca: "llibreta (femení) · ploma (singular, plural)" }
  - id: preposicions-lloc
    titol: "On és? עַל, עַל-יַד, בֵּין, תַּחַת"
    explicacio: "Són mots separats i l'article es manté (עַל הַשּׁוּלְחָן), no com amb בְּ־ i לְ־. בֵּין uneix els dos termes amb וְ־ sense repetir-se, i en present no hi ha verb «ser»."
    exemples:
      - { n: "הֶחָתוּל עַל הַכִּיסֵּא עַל-יַד הַשּׁוּלְחָן.", ca: "El gat és damunt la cadira, al costat de la taula." }
      - { n: "הֶחָתוּל עַל הַכִּיסֵּא בֵּין הַשּׁוּלְחָן וְהָאָרוֹן.", ca: "El gat és damunt la cadira, entre la taula i l'armari." }
      - { n: "אֵיפֹה הַכֶּלֶב? — הַכֶּלֶב תַּחַת הַשּׁוּלְחָן.", ca: "On és el gos? — El gos és sota la taula." }
      - { n: "עַל הַשּׁוּלְחָן יֵשׁ סֵפֶר, מַחְבֶּרֶת וְעֵט.", ca: "Damunt la taula hi ha un llibre, una llibreta i una ploma." }
  - id: be-instrument
    titol: "בְּ־ d'instrument: «amb»"
    explicacio: "A més de «a, en», בְּ־ vol dir «amb» quan introdueix l'eina: בְּגִיר, בְּעֵט. Una frase pot dur les dues."
    exemples:
      - { n: "הַמּוֹרָה כּוֹתֶבֶת בְּגִיר. הַתַּלְמִיד כּוֹתֵב בְּעֵט.", ca: "La mestra escriu amb guix. L'alumne escriu amb ploma." }
      - { n: "לֹא, הֵם כּוֹתְבִים בַּמַּחְבָּרוֹת בְּעִיפָּרוֹן, אוֹ בְּעֵט.", ca: "No, escriuen a les llibretes (lloc) amb llapis o amb ploma (eina)." }
      - { n: "הִיא עוֹמֶדֶת עַל-יַד הַלּוּחַ וְכוֹתֶבֶת עַל הַלּוּחַ בְּגִיר לָבָן.", ca: "És dreta al costat de la pissarra i escriu a la pissarra amb guix blanc." }
  - id: verbs-nous
    titol: "Els verbs nous: יוֹשֵׁב, עוֹמֵד, כּוֹתֵב, אוֹמֵר"
    explicacio: "Fan el present com לוֹמֵד: femení en ‑ֶת (יוֹשֶׁבֶת) i plurals que perden la vocal del mig (יוֹשְׁבִים). Només לִכְתּוֹב fa l'infinitiu regular; לָשֶׁבֶת, לַעֲמוֹד i לוֹמַר s'han d'aprendre."
    exemples:
      - { u: "יושב · יושבת · יושבים · יושבות", n: "יוֹשֵׁב · יוֹשֶׁבֶת · יוֹשְׁבִים · יוֹשְׁבוֹת", ca: "està assegut (m. sg. · f. sg. · m. pl. · f. pl.)" }
      - { u: "עומד · עומדת · עומדים · עומדות", n: "עוֹמֵד · עוֹמֶדֶת · עוֹמְדִים · עוֹמְדוֹת", ca: "està dret (m. sg. · f. sg. · m. pl. · f. pl.)" }
      - { u: "כותב · כותבת · כותבים · כותבות", n: "כּוֹתֵב · כּוֹתֶבֶת · כּוֹתְבִים · כּוֹתְבוֹת", ca: "escriu (m. sg. · f. sg. · m. pl. · f. pl.)" }
      - { u: "אומר · אומרת · אומרים · אומרות", n: "אוֹמֵר · אוֹמֶרֶת · אוֹמְרִים · אוֹמְרוֹת", ca: "diu (m. sg. · f. sg. · m. pl. · f. pl.)" }
      - { n: "יוֹשֵׁב - לָשֶׁבֶת (יָשַׁב) · עוֹמֵד - לַעֲמוֹד (עָמַד)", ca: "seu – seure (va seure) · està dret – estar dret (va estar dret)" }
      - { n: "כּוֹתֵב - לִכְתּוֹב (כָּתַב) · אוֹמֵר - לוֹמַר (אָמַר)", ca: "escriu – escriure (va escriure) · diu – dir (va dir)" }
      - { n: '"בּוֹקֶר טוֹב יִצְחָק! הִנֵּה כִּיסֵּא. בְּבַקָּשָׁה לָשֶׁבֶת!"', ca: "«Bon dia, Itshak! Aquí tens una cadira. Seu, si us plau!» (l'infinitiu fa d'ordre educada)" }
  - id: omer
    titol: "Dir: אוֹמֵר: \"...\", אוֹמֵר לְ..., אוֹמֵר שֶׁ..."
    explicacio: "Entre cometes van les paraules exactes; לְ־ marca a qui es diu, i שֶׁ־ (enganxat al mot següent) introdueix l'estil indirecte, on canvia la persona però no el temps. A les preguntes i darrere d'una cita, el verb sol anar davant del subjecte."
    exemples:
      - { n: 'הַמּוֹרָה אוֹמֶרֶת: "בּוֹקֶר טוֹב, יִצְחָק!"', ca: "La mestra diu: «Bon dia, Itshak!»" }
      - { n: "הַמּוֹרָה אוֹמֶרֶת לְיִצְחָק בּוֹקֶר-טוֹב.", ca: "La mestra diu bon dia a l'Itshak." }
      - { n: "שְׁמִי דָּנִי. — הוּא אוֹמֵר שֶׁשְּׁמוֹ דָּנִי.", ca: "Em dic Dani. — Diu que es diu Dani." }
      - { n: "אֲנִי גָּרָה בְּחֵיפָה. — הִיא אוֹמֶרֶת שֶׁהִיא גָּרָה בְּחֵיפָה.", ca: "Visc a Haifa. — Diu que viu a Haifa." }
      - { n: "רוֹבֶּרְטוֹ אוֹמֵר לְבּוֹרִיס שֶׁרָחֵל אוֹמֶרֶת שֶׁסְּטִיב בַּמִּשְׂרָד.", ca: "El Roberto li diu al Boris que la Rakhel diu que l'Steve és a l'oficina." }
      - { n: '"בּוֹקֶר טוֹב" אוֹמֵר יִצְחָק וְיוֹשֵׁב.', ca: "«Bon dia», diu l'Itshak, i s'asseu." }
  - id: omrim
    titol: "אוֹמְרִים: «es diu»"
    explicacio: "El verb en plural i sense subjecte fa d'impersonal, com «es diu» o «diuen». אֵיךְ אוֹמְרִים בְּעִבְרִית...? és la frase per demanar un mot a classe."
    exemples:
      - { n: "אוֹמְרִים: בְּיִשְׂרָאֵל יֵשׁ קִיבּוּצִים.", ca: "Es diu: a Israel hi ha quibutsos." }
      - { n: "אֵיךְ אוֹמְרִים בְּעִבְרִית.....?", ca: "Com es diu en hebreu...?" }

exercicis:
  # pag-33, תרגיל 19: respon les preguntes amb una frase sencera. Es deixen fora les preguntes obertes
  # o d'opinió (2, 3, 4, 10, 11). Respostes segons context-kenesset (5, 6, 7, 9) i el text de la pag-36 (12, 13).
  # 19.12 i 19.14 adaptats: la pregunta és del dossier; el marc de resposta amb el buit (לֹא, … ____ …) és afegit.
  - { tipus: autocorreccio, origen: "pag-33 ex. 19.1", extra: false, linies: [pag-33-b4-l0],
      enunciat: { n: "בְּיִשְׂרָאֵל יֵשׁ דֶּמוֹקְרַטְיָה?", u: "בישראל יש דמוקרטיה?" },
      model: { n: "כֵּן, בְּיִשְׂרָאֵל יֵשׁ דֶּמוֹקְרַטְיָה.", u: "כן, בישראל יש דמוקרטיה." } }
  - { tipus: autocorreccio, origen: "pag-33 ex. 19.5", extra: false, linies: [pag-33-b4-l4],
      enunciat: { n: "יֵשׁ מֵאָה וְעֶשְׂרִים (120) חֲבֵרִים בַּכְּנֶסֶת?", u: "יש מאה ועשרים (120) חברים בכנסת?" },
      model: { n: "כֵּן, יֵשׁ מֵאָה וְעֶשְׂרִים חֲבֵרִים בַּכְּנֶסֶת.", u: "כן, יש מאה ועשרים חברים בכנסת." } }
  - { tipus: autocorreccio, origen: "pag-33 ex. 19.6", extra: false, linies: [pag-33-b4-l5],
      enunciat: { n: "יֵשׁ בַּכְּנֶסֶת נָשִׁים?", u: "יש בכנסת נשים?" },
      model: { n: "כֵּן, יֵשׁ בַּכְּנֶסֶת נָשִׁים.", u: "כן, יש בכנסת נשים." } }
  - { tipus: autocorreccio, origen: "pag-33 ex. 19.7", extra: false, linies: [pag-33-b4-l6],
      enunciat: { n: "בַּכְּנֶסֶת יֵשׁ עֲרָבִים?", u: "בכנסת יש ערבים?" },
      model: { n: "כֵּן, בַּכְּנֶסֶת יֵשׁ עֲרָבִים.", u: "כן, בכנסת יש ערבים." } }
  - { tipus: autocorreccio, origen: "pag-33 ex. 19.8", extra: false, linies: [pag-33-b4-l7],
      enunciat: { n: "יֵשׁ נֵפְט בְּמֶקְסִיקוֹ?", u: "יש נפט במקסיקו?" },
      model: { n: "כֵּן, יֵשׁ נֵפְט בְּמֶקְסִיקוֹ.", u: "כן, יש נפט במקסיקו." } }
  - { tipus: autocorreccio, origen: "pag-33 ex. 19.9", extra: false, linies: [pag-33-b4-l8],
      enunciat: { n: "בְּיִשְׂרָאֵל יֵשׁ נֵפְט?", u: "בישראל יש נפט?" },
