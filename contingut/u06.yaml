  pag-36-b0:
    vocals:
      0: "זֹאת כִּיתָּה בָּאוּלְפָּן. מַה יֵּשׁ בַּכִּיתָּה?"
    ca:
      0: "Aquesta és una classe de l'ulpan. Què hi ha a la classe?"
  pag-36-b1:
    vocals:
      0: "בַּכִּיתָּה יֵשׁ שׁוּלְחָן. עַל הַשּׁוּלְחָן יֵשׁ סֵפֶר, מַחְבֶּרֶת וְעֵט."
      1: "בַּכִּיתָּה יֵשׁ לוּחַ גָּדוֹל שָׁחוֹר, חַלּוֹנוֹת גְּדוֹלִים וְדֶלֶת."
    ca:
      0: "A la classe hi ha una taula. Damunt la taula hi ha un llibre, una llibreta i una ploma."
      1: "A la classe hi ha una pissarra gran i negra, finestres grans i una porta."
  pag-36-b2:
    vocals:
      0: "יֵשׁ בַּכִּיתָּה טֶלֶווִיזְיָה?"
