      0: "מָה אוֹמֵר רוֹבֶּרְטוֹ לְבּוֹרִיס?"
      1: "רוֹבֶּרְטוֹ אוֹמֵר לְבּוֹרִיס שֶׁרָחֵל אוֹמֶרֶת שֶׁסְּטִיב בַּמִּשְׂרָד."
    ca:
      0: "Què li diu el Roberto al Boris?"
      1: "El Roberto li diu al Boris que la Rakhel diu que l'Steve és a l'oficina."
