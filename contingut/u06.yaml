      0: "Exercici de substitució"
  pag-39-b1:
    vocals:
      0: "1. [הַמּוֹרָה] עוֹמֶדֶת עַל-יַד הַלּוּחַ וְכוֹתֶבֶת בְּגִיר."
      1: "(הַמּוֹרֶה, הֵם, הַתַּלְמִידוֹת)"
      2: "2. יִצְחָק עוֹמֵד [פֹּה]."
      3: "(שָׁם, עַל-יַד הַחַלּוֹן, בַּכִּיתָּה, בֵּין הַחַלּוֹן וְהַדֶּלֶת)"
      4: '3. [הוּא] אוֹמֵר "שָׁלוֹם" וְיוֹשֵׁב.'
      5: "(דָּנִי וַאֲנִי, שָׂרָה וְדוֹרִיס, הַמּוֹרָה)"
      6: "4. מָה [אַתָּה] אוֹמֵר?"
      7: "(אַתְּ, אַתֶּם, הַיְּלָדוֹת)"
      8: "5. סְטִיב אוֹמֵר שֶׁ[אֶסְתֵּר יָפָה]."
      9: "(הֵם בַּבַּיִת, הַשִּׁיעוּר מְעַנְייֵן, הַחֶדֶר יָפֶה)"
      10: "6. חַנָּה כּוֹתֶבֶת [בְּעֵט]."
    ca:
      0: "1. [La mestra] és dreta al costat de la pissarra i escriu amb guix."
      1: "(el mestre, ells, les alumnes)"
      2: "2. L'Itshak és dret [aquí]."
      3: "(allà, al costat de la finestra, a la classe, entre la finestra i la porta)"
      4: "3. [Ell] diu «hola» i s'asseu."
      5: "(el Dani i jo, la Sara i la Doris, la mestra)"
      6: "4. Què dius [tu]?"
      7: "(tu, a una dona; vosaltres; les nenes)"
      8: "5. L'Steve diu que [l'Ester és bonica]."
      9: "(són a casa, la classe és interessant, l'habitació és bonica)"
      10: "6. La Hanà escriu [amb ploma]."

