  pag-36-b3:
    vocals:
      0: "לֹא, טֶלֶווִיזְיָה יֵשׁ בַּמּוֹעֲדוֹן שֶׁל הָאוּלְפָּן."
    ca:
      0: "No, televisor n'hi ha al club de l'ulpan."
  pag-36-b4:
    vocals:
      0: "וְטֶלֶפוֹן יֵשׁ בַּכִּיתָּה?"
    ca:
      0: "I telèfon, n'hi ha a la classe?"
  pag-36-b5:
    vocals:
      0: "לֹא. גַּם טֶלֶפוֹן אֵין בַּכִּיתָּה. טֶלֶפוֹן יֵשׁ בַּמִּשְׂרָד."
    ca:
      0: "No. A la classe tampoc no hi ha telèfon. Telèfon n'hi ha a l'oficina."
  pag-36-b6:
    vocals:
      0: "יֵשׁ פֹּה כִּיסֵּא?"
    ca:
      0: "Hi ha cap cadira, aquí?"
  pag-36-b7:
    vocals:
      0: "יֵשׁ פֹּה הַרְבֵּה כִּיסְאוֹת."
    ca:
      0: "Aquí hi ha moltes cadires."
  pag-36-b8:
    vocals:
      0: "וְאֵיפֹה הַתַּלְמִידִים? מָה הֵם עוֹשִׂים?"
    ca:
      0: "I on són els alumnes? Què fan?"
  pag-36-b9:
    vocals:
      0: "הַתַּלְמִידִים בַּכִּיתָּה. הֵם יוֹשְׁבִים עַל הַכִּסְאוֹת וְלוֹמְדִים."
    ca:
      0: "Els alumnes són a la classe. Estan asseguts a les cadires i estudien."
  pag-36-b10:
    vocals:
      0: "אֵיפֹה הַמּוֹרָה? מָה הִיא עוֹשָׂה?"
    ca:
      0: "On és la mestra? Què fa?"
  pag-36-b11:
    vocals:
      0: "גַּם הִיא בַּכִּיתָּה. הִיא עוֹמֶדֶת עַל-יַד הַלּוּחַ וְכוֹתֶבֶת עַל הַלּוּחַ בְּגִיר לָבָן. הִיא כּוֹתֶבֶת עַל הַלּוּחַ מִילִּים חֲדָשׁוֹת."
    ca:
      0: "Ella també és a la classe. És dreta al costat de la pissarra i escriu a la pissarra amb guix blanc. Escriu paraules noves a la pissarra."
  pag-37-b0:
    vocals:
      0: "גַּם הַתַּלְמִידִים כּוֹתְבִים עַל הַלּוּחַ בְּגִיר?"
    ca:
      0: "Els alumnes també escriuen a la pissarra amb guix?"
  pag-37-b1:
    vocals:
      0: "לֹא, הֵם כּוֹתְבִים בַּמַּחְבָּרוֹת בְּעִיפָּרוֹן, אוֹ בְּעֵט."
    ca:
      0: "No, escriuen a les llibretes amb llapis o amb ploma."
  pag-37-b2:
    vocals:
      0: "מִי עוֹמֵד עַל-יַד הַדֶּלֶת?"
    ca:
      0: "Qui és dret al costat de la porta?"
  pag-37-b3:
    vocals:
      0: "יִצְחָק עוֹמֵד עַל-יַד הַדֶּלֶת. הַמּוֹרָה אוֹמֶרֶת:"
      1: '"בּוֹקֶר טוֹב יִצְחָק! הִנֵּה כִּיסֵּא. בְּבַקָּשָׁה לָשֶׁבֶת!"'
      2: '"בּוֹקֶר טוֹב" אוֹמֵר יִצְחָק וְיוֹשֵׁב.'
      3: "עַכְשָׁיו גַּם יִצְחָק לוֹמֵד. עַכְשָׁיו גַּם יִצְחָק כּוֹתֵב."
    ca:
      0: "L'Itshak és dret al costat de la porta. La mestra diu:"
      1: "«Bon dia, Itshak! Aquí tens una cadira. Seu, si us plau!»"
      2: "«Bon dia», diu l'Itshak, i s'asseu."
      3: "Ara l'Itshak també estudia. Ara l'Itshak també escriu."
  pag-37-b4:
    vocals:
      0: "הַמּוֹרָה כּוֹתֶבֶת בְּגִיר. הַתַּלְמִיד כּוֹתֵב בְּעֵט."
    ca:
      0: "La mestra escriu amb guix. L'alumne escriu amb ploma."
  pag-37-b5:
    vocals:
      0: "יוֹשֵׁב  ·  יוֹשֶׁבֶת  ·  יוֹשְׁבִים  ·  יוֹשְׁבוֹת"
      1: "עוֹמֵד  ·  עוֹמֶדֶת  ·  עוֹמְדִים  ·  עוֹמְדוֹת"
      2: "כּוֹתֵב  ·  כּוֹתֶבֶת  ·  כּוֹתְבִים  ·  כּוֹתְבוֹת"
      3: "אוֹמֵר  ·  אוֹמֶרֶת  ·  אוֹמְרִים  ·  אוֹמְרוֹת"
    ca:
      0: "estar assegut, en present: m. sg. · f. sg. · m. pl. · f. pl."
      1: "estar dret, en present: m. sg. · f. sg. · m. pl. · f. pl."
      2: "escriure, en present: m. sg. · f. sg. · m. pl. · f. pl."
      3: "dir, en present: m. sg. · f. sg. · m. pl. · f. pl."
  pag-38-b0:
    vocals:
      0: 'אוֹמֵר: "......"'
      1: "אוֹמֵר לְ......"
      2: "אוֹמֵר שֶׁ......"
    ca:
      0: "diu: «...»"
      1: "diu a..."
      2: "diu que..."
  pag-38-b1:
    vocals:
      0: 'הַמּוֹרָה אוֹמֶרֶת: "בּוֹקֶר טוֹב, יִצְחָק!"'
    ca:
      0: "La mestra diu: «Bon dia, Itshak!»"
  pag-38-b2:
    vocals:
      0: "מָה אוֹמֶרֶת הַמּוֹרָה לְיִצְחָק?"
      1: "הַמּוֹרָה אוֹמֶרֶת לְיִצְחָק בּוֹקֶר-טוֹב."
    ca:
      0: "Què li diu la mestra a l'Itshak?"
      1: "La mestra diu bon dia a l'Itshak."
  pag-38-b3:
    vocals:
      0: "יֶלֶד, מַה שִּׁמְךָ?"
      1: "שְׁמִי דָּנִי."
    ca:
      0: "Nen, com et dius?"
      1: "Em dic Dani."
  pag-38-b4:
    vocals:
      0: "מָה אוֹמֵר הַיֶּלֶד לָאִישׁ? הוּא אוֹמֵר שֶׁשְּׁמוֹ דָּנִי."
    ca:
      0: "Què li diu el nen a l'home? Diu que es diu Dani."
  pag-38-b5:
    vocals:
      0: "אֵיפֹה אַתְּ גָּרָה?"
      1: "אֲנִי גָּרָה בְּחֵיפָה."
    ca:
      0: "On vius?"
      1: "Visc a Haifa."
  pag-38-b6:
    vocals:
      0: "מָה אוֹמֶרֶת תָּמָר לְיוֹסֵף?"
      1: "הִיא אוֹמֶרֶת שֶׁהִיא גָּרָה בְּחֵיפָה."
    ca:
      0: "Què li diu la Tamar al Iossef?"
      1: "Diu que viu a Haifa."
  pag-38-b7:
