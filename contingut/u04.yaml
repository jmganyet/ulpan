gramatica:
  - id: shel-mi
    titol: De qui és? שֶׁל מִי?
    explicacio: "שֶׁל מִי va davant de la cosa, que porta article: «de qui l'habitació?». A la resposta, darrere de שֶׁל hi va un nom propi sense article o un nom comú amb article; amb dos posseïdors, שֶׁל es pot repetir."
    exemples:
      - { n: "שֶׁל מִי הַכֶּסֶף? - הַכֶּסֶף שֶׁל שָׂרָה.", ca: "De qui són els diners? — Els diners són de la Sara." }
      - { n: "שֶׁל מִי הַכֶּלֶב? - הַכֶּלֶב שֶׁל הַיְּלָדִים.", ca: "De qui és el gos? — El gos és dels nens." }
      - { n: "שֶׁל מִי הַחֶדֶר? - הַחֶדֶר שֶׁל רוֹבֶּרְטוֹ וְשֶׁל עִמָּנוּאֵל.", ca: "De qui és l'habitació? — L'habitació és del Roberto i de l'Emanuel." }
      - { n: "זֶה הַחֶדֶר שֶׁל הַמּוֹרָה?", ca: "És aquesta l'habitació de la mestra?" }
  - id: pronom-resposta
    titol: El pronom que respon
    explicacio: "Per dir com és una cosa, la resposta porta הוּא, הִיא, הֵם o הֵן segons el gènere i el nombre del nom; en català no hi posem pronom. מְכוֹנִית és femení (הִיא) i סֵפֶר, masculí (הוּא)."
    exemples:
      - { n: "הַמְּכוֹנִית שֶׁל מֹשֶׁה טוֹבָה? – כֵּן, הִיא טוֹבָה מְאוֹד.", ca: "El cotxe del Moixè és bo? — Sí, és molt bo." }
      - { u: "הספר מעניין? – כן, הוא מעניין מאוד.", n: "הַסֵּפֶר מְעַנְייֵן? – כֵּן, הוּא מְעַנְייֵן מְאוֹד.", ca: "El llibre és interessant? — Sí, és molt interessant." }
      - { n: "הַסִּיגַרְיּוֹת טוֹבוֹת? – לֹא, הֵן לֹא טוֹבוֹת.", ca: "Els cigarrets són bons? — No, no són bons." }
  - id: shem-sufixos
    titol: Com et dius? Els sufixos de שֵׁם
    explicacio: "El posseïdor s'enganxa al nom com a sufix: שְׁמִי (el meu nom), שְׁמוֹ (d'ell), שְׁמָהּ (d'ella). A un home es diu שִׁמְךָ i a una dona שְׁמֵךְ, que sense vocals s'escriuen igual: שמך."
    exemples:
      - { n: "סְלִיחָה, מִי אַתְּ? מַה שְּׁמֵךְ?", ca: "Perdó, qui ets? Com et dius? (a una dona)" }
      - { n: "שְׁמִי שָׂרָה. וּמַה שִּׁמְךָ?", ca: "Em dic Sara. I tu, com et dius? (a un home)" }
      - { n: "שְׁמוֹ יוֹסֵף. שְׁמָהּ שָׂרָה.", ca: "Ell es diu Iossef. Ella es diu Sara." }
      - { n: "מַה שִּׁמְךָ? · מַה שְּׁמֵךְ?", ca: "Com et dius? (a un home · a una dona)" }
  - id: shalom-sufixos
    titol: Com estàs? Els sufixos de שָׁלוֹם
    explicacio: "שָׁלוֹם pren els mateixos sufixos. Per una tercera persona es pregunta מַה שְּׁלוֹם + nom, i la resposta va en masculí singular perquè concorda amb שָׁלוֹם: שְׁלוֹמָהּ טוֹב."
    exemples:
      - { n: "בּוֹקֶר טוֹב שָׂרָה. מַה שְּׁלוֹמֵךְ?", ca: "Bon dia, Sara. Com estàs? (a una dona)" }
      - { n: "טוֹב, תּוֹדָה. מַה שְּׁלוֹמְךָ?", ca: "Bé, gràcies. Com estàs? (a un home)" }
      - { n: "שְׁלוֹמָהּ מְצוּיָּן. מַה שְּׁלוֹם יִצְחָק?", ca: "Està perfectament. Com està l'Itshak?" }
      - { n: "שְׁלוֹמֵנוּ · שְׁלוֹמְכֶם · שְׁלוֹמְכֶן · שְׁלוֹמָם · שְׁלוֹמָן", ca: "estem · esteu (m.) · esteu (f.) · estan (m.) · estan (f.)" }
      - { n: "מַה שְּׁלוֹם הַיְּלָדִים? — שְׁלוֹמָם מְצוּיָּן.", ca: "Com estan els nens? — Estan perfectament." }
  - id: shem-ha
    titol: Tres maneres de dir el nom
    explicacio: "El nom d'algú es diu amb el sufix, amb שֶׁל o enganxant שֵׁם al nom següent. En aquesta última, שֵׁם no porta article i el segon nom sí: שֵׁם הַיֶּלֶד."
    exemples:
      - { n: "זֶה יֶלֶד. שְׁמוֹ דָּנִי.", ca: "És un nen. Es diu Dani." }
      - { n: "זֶה יֶלֶד. הַשֵּׁם שֶׁל הַיֶּלֶד דָּנִי.", ca: "És un nen. El nom del nen és Dani." }
      - { n: "זֶה יֶלֶד. שֵׁם הַיֶּלֶד דָּנִי.", ca: "És un nen. El nom del nen és Dani." }
      - { n: "מַה שֵּׁם הַיֶּלֶד? – דָּנִי.", ca: "Com es diu el nen? — Dani." }
  - id: shemot-ivriyim
    titol: שֵׁמוֹת עִבְרִיִּים
    explicacio: "שֵׁם és masculí encara que el plural acabi en ‑וֹת, i per això l'adjectiu va en ‑ִים. עִבְרִי fa עִבְרִית, עִבְרִיִּים, עִבְרִיּוֹת."
    exemples:
      - { n: 'שָׂרָה וְיוֹסֵף שֵׁמוֹת עִבְרִיִּים מֵהַתַּנַ"ךְ.', ca: "Sara i Iossef són noms hebreus de la Bíblia." }
      - { n: "עִבְרִי, עִבְרִית, עִבְרִיִּים, עִבְרִיּוֹת", ca: "hebreu, hebrea, hebreus, hebrees", extra: true }
  - id: salutacions
    titol: Salutacions i respostes
    explicacio: "Les fórmules dels dos diàlegs. Les respostes a מַה שְּׁלוֹמְךָ? van de מְצוּיָּן a רַע מְאוֹד; לֹא רַע vol dir «no gaire malament»."
    exemples:
      - { n: "בּוֹקֶר טוֹב רָחֵל.", ca: "Bon dia, Rakhel." }
      - { n: "שָׁלוֹם יוֹסֵף, לְהִתְרָאוֹת בָּאוּלְפָּן.", ca: "Adéu, Iossef, ens veiem a l'ulpan." }
      - { n: "שָׁלוֹם וּלְהִתְרָאוֹת.", ca: "Adéu i a reveure." }
      - { n: "גַּם שְׁלוֹמִי טוֹב. בָּרוּךְ הַשֵּׁם!", ca: "Jo també estic bé, gràcies a Déu! (literalment, beneït el Nom)" }
      - { u: "מצוין · טוב מאוד · טוב · ככה-ככה · לא רע · רע · רע מאוד", n: "מְצוּיָּן · טוֹב מְאוֹד · טוֹב · כָּכָה-כָּכָה · לֹא רַע · רַע · רַע מְאוֹד", ca: "perfectament · molt bé · bé · així així · no gaire malament · malament · molt malament", extra: true }
  - id: metsuyan-ra
    titol: מְצוּיָּן i רַע en quatre formes
    explicacio: "Concorden com els adjectius de la unitat 2. A les altres formes, רַע passa a רָ־ (רָעָה, רָעִים, רָעוֹת), però sona igual."
    exemples:
      - { u: "מצוין, מצוינת, מצוינים, מצוינות", n: "מְצוּיָּן, מְצוּיֶּנֶת, מְצוּיָּנִים, מְצוּיָּנוֹת", ca: "excel·lent (m. sg., f. sg., m. pl., f. pl.)", extra: true }
      - { n: "רַע, רָעָה, רָעִים, רָעוֹת", ca: "dolent, dolenta, dolents, dolentes", extra: true }
      - { n: "גַּם שְׁלוֹמוֹ לֹא רַע.", ca: "Ell també: no està malament." }

exercicis:
  # pag-21, תרגיל 9: הַ־, מִ־, בְּ־ o שֶׁל (9.2 i 9.3 són per comprovar)
  - { tipus: forat, origen: "pag-21 ex. 9.1", extra: false, linies: [pag-21-b1-l0],
      frase: { u: "מאין המכונית של סטיב? – ____אנגליה.", n: "מֵאַיִן הַמְּכוֹנִית שֶׁל סְטִיב? – ____אַנְגְלִיָּה." },
      opcions: ["הַ־", "מִ־", "בְּ־", "שֶׁל"], correcta: 1, retro: "מֵאַיִן pregunta per la procedència: מֵאַנְגְלִיָּה." }
  - { tipus: autocorreccio, origen: "pag-21 ex. 9.4", extra: false, linies: [pag-21-b1-l3],
      enunciat: { n: "זֹאת ____אִישָּׁה ____יִצְחָק? – לֹא, זֹאת ____אִישָּׁה ____מֹשֶׁה.", u: "זאת ____אישה ____יצחק? – לא, זאת ____אישה ____משה." },
      model: { n: "זֹאת הָאִישָּׁה שֶׁל יִצְחָק? – לֹא, זֹאת הָאִישָּׁה שֶׁל מֹשֶׁה.", u: "זאת האישה של יצחק? – לא, זאת האישה של משה." } }
  - { tipus: forat, origen: "pag-21 ex. 9.5", extra: false, linies: [pag-21-b1-l4],
      frase: { u: "מי גר ____חיפה? – תמר ואסתר.", n: "מִי גָּר ____חֵיפָה? – תָּמָר וְאֶסְתֵּר." },
      opcions: ["הַ־", "מִ־", "בְּ־", "שֶׁל"], correcta: 2, retro: "On viu algú: בְּחֵיפָה." }
  - { tipus: forat, origen: "pag-21 ex. 9.6", extra: false, linies: [pag-21-b1-l5],
      frase: { u: "____מי הכלב? – של הבן של חנה.", n: "____מִי הַכֶּלֶב? – שֶׁל הַבֵּן שֶׁל חַנָּה." },
      opcions: ["הַ־", "מִ־", "בְּ־", "שֶׁל"], correcta: 3, retro: "La pregunta de possessió és שֶׁל מִי." }
  - { tipus: forat, origen: "pag-21 ex. 9.6", extra: false, linies: [pag-21-b1-l5],
      frase: { u: "של מי הכלב? – של ____בן של חנה.", n: "שֶׁל מִי הַכֶּלֶב? – שֶׁל ____בֵּן שֶׁל חַנָּה." },
      opcions: ["הַ־", "מִ־", "בְּ־", "שֶׁל"], correcta: 0, retro: "Darrere de שֶׁל, un nom comú porta article: הַבֵּן." }
  - { tipus: forat, origen: "pag-21 ex. 9.7", extra: false, linies: [pag-21-b1-l6],
      frase: { u: "של מי הסיגריות? – ____סטיב.", n: "שֶׁל מִי הַסִּיגַרְיּוֹת? – ____סְטִיב." },
      opcions: ["הַ־", "מִ־", "בְּ־", "שֶׁל"], correcta: 3, retro: "Es respon de qui són: שֶׁל סְטִיב." }
  - { tipus: autocorreccio, origen: "pag-21 ex. 9.8", extra: false, linies: [pag-21-b1-l7],
