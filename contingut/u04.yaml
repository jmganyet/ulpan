# Capa curada de la unitat 4: icones, textos, gramàtica, exercicis.
# Format: vegeu scripts/genera-contingut.ts (tipus Curat).
# Vocals verificades amb els TSV (u01-u04) i la fitxa u04-possessio-i-salutacions del dossier i amb Pealim.
# Grafia plena amb vocals (R19): אִישָּׁה, מְעַנְייֵן, תַּייָּר, תַּייֶּרֶת (com a la u01-u02);
# מְצוּיָּן, מְצוּיֶּנֶת amb el dagesh de la י que dona Pealim (el TSV escriu מְצוּיָן sense dagesh).
# Dagesh darrere de מַה (מַה שְּׁמֵךְ, מַה שְּׁלוֹם…), com fa el vocabulari del dossier.
# Les línies «per comprovar» (⁇) no porten vocals ni traducció.
# Sense vocals (no confirmades o ambigües): pag-21-b1-l9 (מריו, אורוגוואי), pag-25-b1-l7 (שלומך sense
# destinatari: ךָ o ךְ), pag-26-b3-l2 (יפה en una llista: masculí o femení). Les notes del transcriptor
# en català (pag-20-b6-l0, pag-20-b8-l0) no porten vocals ni traducció; el generador les marca com a nota (R25).

