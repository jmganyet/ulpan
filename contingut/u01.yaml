  # Extra: comprensió i producció a partir dels diàlegs
  - { tipus: comprensio, origen: extra, extra: true, linies: [pag-02-b0-l0, pag-02-b0-l1, pag-02-b0-l2, pag-02-b0-l3, pag-02-b0-l4, pag-02-b0-l5],
      text: "שָׁלוֹם, אֲנִי רוֹבֶּרְטוֹ. — אֲנִי דּוֹרִיס. — נָעִים מְאוֹד. — נָעִים מְאוֹד. אַתָּה תַּלְמִיד? — כֵּן, אֲנִי תַּלְמִיד. אַתְּ תַּלְמִידָה? — כֵּן, אֲנִי תַּלְמִידָה.",
      pregunta: "Què són el Roberto i la Doris?", opcions: ["Alumnes", "Mestres", "Turistes"], correcta: 0 }
