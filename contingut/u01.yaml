gramatica:
  - id: pronoms
    titol: Els pronoms personals
    explicacio: L'hebreu distingeix el masculí i el femení a la segona i a la tercera persona. La primera persona, אֲנִי i אֲנַחְנוּ, no té gènere.
    exemples:
      - { n: "אֲנִי, אַתָּה, אַתְּ, הוּא, הִיא", ca: "jo, tu (m.), tu (f.), ell, ella" }
      - { n: "אֲנַחְנוּ, אַתֶּם, אַתֶּן, הֵם, הֵן", ca: "nosaltres, vosaltres (m.), vosaltres (f.), ells, elles" }
      - { n: "אַתָּה תַּלְמִיד? אַתְּ תַּלְמִידָה?", ca: "Ets alumne? Ets alumna?" }
  - id: frase-sense-verb
    titol: La frase sense verb
    explicacio: En present no hi ha verb «ser»; es posa el subjecte i al costat el que se'n diu. Tampoc no hi ha article indefinit.
    exemples:
      - { n: "אֲנִי רוֹבֶּרְטוֹ.", ca: "Sóc el Roberto." }
      - { n: "הוּא תַּלְמִיד.", ca: "És alumne." }
      - { n: "הֵם חֲבֵרִים טוֹבִים.", ca: "Són bons amics." }
      - { n: "הִיא לֹא תַּייֶּרֶת, הִיא עוֹלָה חֲדָשָׁה.", ca: "No és turista, és una immigrant nova.", extra: true }
  - id: negar-preguntar
    titol: Negar i preguntar
    explicacio: לֹא va just davant del que es nega i serveix també de «no» sol. La pregunta de sí o no és la mateixa frase amb entonació de pregunta.
    exemples:
      - { n: "אֲנִי לֹא תַּייָּר.", ca: "No sóc turista." }
      - { n: "לֹא, אֲנִי לֹא עוֹלָה חֲדָשָׁה.", ca: "No, no sóc una immigrant nova." }
      - { n: "אַתָּה תַּלְמִיד?", ca: "Ets alumne?" }
      - { n: "מִי אַתָּה? מֵאַיִן אַתָּה?", ca: "Qui ets? D'on ets?", extra: true }
  - id: masculi-femeni
    titol: Masculí i femení
    explicacio: El femení es fa afegint ‑ָה o ‑ֶת al masculí. Sense vocals, מורה i עולה s'escriuen igual en tots dos gèneres.
    exemples:
      - { n: "תַּלְמִיד, תַּלְמִידָה", ca: "alumne, alumna" }
      - { n: "תַּייָּר, תַּייֶּרֶת", ca: "turista (m.), turista (f.)" }
      - { n: "מוֹרֶה, מוֹרָה", ca: "mestre, mestra" }
      - { n: "חָבֵר, חֲבֵרָה", ca: "amic, amiga" }
  - id: singular-plural
    titol: Singular i plural
    explicacio: El masculí plural acaba en ‑ִים i el femení plural en ‑וֹת. El femení perd la terminació del singular abans de prendre ‑וֹת.
    exemples:
      - { n: "תַּלְמִידִים, תַּלְמִידוֹת", ca: "alumnes (m.), alumnes (f.)" }
      - { n: "תַּייָּרִים, תַּייָּרוֹת", ca: "turistes (m.), turistes (f.)" }
      - { n: "מוֹרִים, מוֹרוֹת", ca: "mestres (m.), mestres (f.)" }
  - id: adjectiu
    titol: L'adjectiu
    explicacio: Va darrere del nom i hi concorda en gènere i nombre. מְאוֹד va darrere de l'adjectiu.
    exemples:
      - { n: "חָבֵר טוֹב, חֲבֵרָה טוֹבָה", ca: "un bon amic, una bona amiga" }
      - { n: "חֲבֵרִים טוֹבִים, חֲבֵרוֹת טוֹבוֹת", ca: "bons amics, bones amigues" }
      - { n: "עוֹלִים חֲדָשִׁים, עוֹלוֹת חֲדָשׁוֹת", ca: "immigrants nous, immigrants noves" }
      - { n: "טוֹב מְאוֹד", ca: "molt bo" }
  - id: particules
    titol: Les partícules enganxades al mot
    explicacio: הַ־ (el, la, els, les), מִ־ / מֵ־ (de, procedència) i וְ־ / וּ־ (i) s'escriuen unides al mot que les segueix. הַ־ no canvia per gènere ni per nombre.
    exemples:
      - { n: "הַמּוֹרִים", ca: "els mestres" }
      - { n: "מִבְּרָזִיל, מֵאַנְגְלִיָּה", ca: "del Brasil, d'Anglaterra" }
      - { n: "שָׂרָה וְיִצְחָק", ca: "la Sara i l'Itshak" }
      - { n: "אֶסְתֵּר וְתָמָר", ca: "l'Ester i la Tamar" }
  - id: shel-gam-aval
    titol: «De» de possessió, «també» i «però»
    explicacio: שֶׁל marca qui té què i és un mot independent. גַּם va davant del que s'afegeix; אֲבָל vol dir «però».
    exemples:
      - { n: "הַחָבֵר שֶׁל שָׂרָה", ca: "l'amic de la Sara" }
      - { n: "גַּם אֲנִי תַּלְמִיד.", ca: "Jo també sóc alumne." }
      - { n: "גַּם הִיא מִדְּרוֹם-אֲמֶרִיקָה, אֲבָל לֹא מֵאוּרוּגְוַאי.", ca: "També és de Sud-amèrica, però no de l'Uruguai.", extra: true }

exercicis:
  # pag-08, תרגיל 1: el pronom que falta
  - { tipus: forat, origen: "pag-08 ex. 1.1", extra: false, linies: [pag-08-b1-l0],
      frase: { u: "היא תלמידה טובה? — כן, ____ תלמידה טובה.", n: "הִיא תַּלְמִידָה טוֹבָה? — כֵּן, ____ תַּלְמִידָה טוֹבָה." },
      opcions: ["הִיא", "הוּא", "אַתְּ", "הֵן"], correcta: 0, retro: "Es parla d'ella: הִיא." }
  - { tipus: forat, origen: "pag-08 ex. 1.2", extra: false, linies: [pag-08-b1-l1],
      frase: { u: "את גברת לוי? — לא, ____ לא גברת לוי.", n: "אַתְּ גְּבֶרֶת לֵוִי? — לֹא, ____ לֹא גְּבֶרֶת לֵוִי." },
      opcions: ["אַתְּ", "אֲנִי", "הִיא", "אַתָּה"], correcta: 1, retro: "Li pregunten a ella; respon en primera persona: אֲנִי." }
  - { tipus: forat, origen: "pag-08 ex. 1.3", extra: false, linies: [pag-08-b1-l2],
      frase: { u: "מי הם? — ____ רוברטו ועמנואל.", n: "מִי הֵם? — ____ רוֹבֶּרְטוֹ וְעִמָּנוּאֵל." },
      opcions: ["הֵן", "הֵם", "אַתֶּם", "אֲנַחְנוּ"], correcta: 1, retro: "Dos homes: masculí plural, הֵם." }
  - { tipus: forat, origen: "pag-08 ex. 1.4", extra: false, linies: [pag-08-b1-l3],
      frase: { u: "____ תלמידות טובות? — כן, הן תלמידות טובות.", n: "____ תַּלְמִידוֹת טוֹבוֹת? — כֵּן, הֵן תַּלְמִידוֹת טוֹבוֹת." },
      opcions: ["הֵם", "אַתֶּם", "הֵן", "הִיא"], correcta: 2, retro: "La resposta parla d'elles: הֵן." }
  - { tipus: forat, origen: "pag-08 ex. 1.5", extra: false, linies: [pag-08-b1-l4],
      frase: { u: "מאין אתם? — ____ מִקָּנָדָה.", n: "מֵאַיִן אַתֶּם? — ____ מִקָּנָדָה." },
      opcions: ["אַתֶּם", "הֵם", "אֲנִי", "אֲנַחְנוּ"], correcta: 3, retro: "Pregunten «d'on sou?»; es respon «som»: אֲנַחְנוּ." }
  - { tipus: forat, origen: "pag-08 ex. 1.6", extra: false, linies: [pag-08-b1-l5],
      frase: { u: "____ מורה? — לא, אני תלמיד.", n: "____ מוֹרֶה? — לֹא, אֲנִי תַּלְמִיד." },
      opcions: ["אַתָּה", "אַתְּ", "הוּא", "אֲנִי"], correcta: 0, retro: "Respon un home en primera persona; la pregunta és a ell: אַתָּה." }
  - { tipus: forat, origen: "pag-08 ex. 1.7", extra: false, linies: [pag-08-b1-l6],
      frase: { u: "____ מורה טוב? — כן, הוא מורה טוב.", n: "____ מוֹרֶה טוֹב? — כֵּן, הוּא מוֹרֶה טוֹב." },
      opcions: ["הִיא", "הוּא", "אַתָּה", "הֵם"], correcta: 1, retro: "La resposta parla d'ell: הוּא." }
  - { tipus: forat, origen: "pag-08 ex. 1.9", extra: false, linies: [pag-08-b1-l8],
      frase: { u: "____ חברה של יצחק? — כן, אני חברה של יצחק.", n: "____ חֲבֵרָה שֶׁל יִצְחָק? — כֵּן, אֲנִי חֲבֵרָה שֶׁל יִצְחָק." },
      opcions: ["אַתָּה", "הִיא", "אַתְּ", "אַתֶּן"], correcta: 2, retro: "Respon una dona en primera persona; la pregunta és a ella: אַתְּ." }
  - { tipus: forat, origen: "pag-08 ex. 1.10", extra: false, linies: [pag-08-b1-l9],
      frase: { u: "____ תיירים? — לא, אנחנו לא תיירים.", n: "____ תַּייָּרִים? — לֹא, אֲנַחְנוּ לֹא תַּייָּרִים." },
      opcions: ["אַתֶּם", "אַתֶּן", "הֵן", "אֲנַחְנוּ"], correcta: 0, retro: "Responen «nosaltres» en masculí; la pregunta és a vosaltres: אַתֶּם." }

