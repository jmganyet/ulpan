  - { tipus: comprensio, origen: extra, extra: true, linies: [pag-03-b2-l0, pag-03-b2-l1, pag-03-b2-l2],
      text: "אֲנִי שָׂרָה לֵוִי. — גְּבֶרֶת לֵוִי, אַתְּ מוֹרָה? — לֹא, אֲנִי לֹא מוֹרָה. אֲנִי תַּלְמִידָה.",
